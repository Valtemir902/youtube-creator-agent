name: Diagnose Production

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose-production.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Check diagnostic credentials
        id: creds
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$VPS_HOST" && -n "$VPS_USER" && -n "$VPS_SSH_PRIVATE_KEY" && -n "$VPS_KNOWN_HOSTS" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Required VPS secrets are missing."
          fi

      - name: Configure SSH
        if: steps.creds.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Collect sanitized onboarding diagnostics
        if: steps.creds.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          ssh -i ~/.ssh/id_ed25519 -p "$port" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'set -euo pipefail; cd ~/apps/youtube-creator-agent; echo "=== compose ps ==="; docker compose -f deploy/docker-compose.oracle.yml ps onboarding keycloak mcp; echo; echo "=== recent onboarding oauth/callback logs ==="; docker compose -f deploy/docker-compose.oracle.yml logs --since=30m onboarding 2>&1 | grep -E "oauth/google/callback|google|OAuth|oauth|Traceback|ERROR|Exception|Internal Server Error|invalid_grant|redirect_uri|scope|token" | tail -n 220 | sed -E "s/(code=)[^& ]+/\1REDACTED/g; s/(state=)[^& ]+/\1REDACTED/g; s/(access_token[=: ]+)[^, }]+/\1REDACTED/g; s/(refresh_token[=: ]+)[^, }]+/\1REDACTED/g; s/(client_secret[=: ]+)[^, }]+/\1REDACTED/g"; echo; echo "=== public health ==="; curl -fsS https://creator.silvadigitaltech.com/health; echo; curl -fsS https://creator.silvadigitaltech.com/ready; echo'
name: Elite V2 Visual Smoke

on:
  push:
    branches: [feat/elite-v2-ui-system]
    paths:
      - 'src/elite_v2_ui.py'
      - 'src/elite_v2_content_hub.py'
      - 'src/elite_v2_growth.py'
      - 'src/elite_v2_analytics.py'
      - 'src/desktop_web_shell.py'
      - 'src/desktop_local_server.py'
      - 'src/creator_service/web/dashboard.html'
      - 'src/creator_service/local_ai_dashboard.py'
      - 'scripts/ui_v2_visual_smoke.py'
      - '.github/workflows/elite-v2-visual-smoke.yml'
  workflow_dispatch:

jobs:
  visual-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
      QT_QUICK_BACKEND: software
      QTWEBENGINE_DISABLE_SANDBOX: '1'
      QTWEBENGINE_CHROMIUM_FLAGS: '--disable-gpu --disable-gpu-compositing --disable-features=VizDisplayCompositor --no-sandbox'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused UI dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install `
            'PySide6==6.7.3' `
            'PySide6-Essentials==6.7.3' `
            'PySide6-Addons==6.7.3' `
            'shiboken6==6.7.3' `
            'fastapi>=0.116,<1' `
            'google-auth>=2.34,<3' `
            'google-auth-oauthlib>=1.2,<2'

      - name: Capture key Elite V2 workspace screenshots
        shell: pwsh
        run: |
          python scripts/ui_v2_visual_smoke.py | Tee-Object -FilePath artifacts/ui-v2/visual-smoke.log
          if ($LASTEXITCODE -ne 0) { throw "Elite V2 visual smoke falhou com exit code $LASTEXITCODE" }
          $jsonLine = Get-Content artifacts/ui-v2/visual-smoke.log | Where-Object { $_ -match '^\{"ok"\s*:' } | Select-Object -Last 1
          if (-not $jsonLine) { throw 'Visual smoke terminou sem payload JSON final' }
          $result = $jsonLine | ConvertFrom-Json
          if (-not $result.ok) { throw 'Visual smoke não retornou ok=true' }
          if ($result.ui_version -ne 'elite-v2') { throw "Versão visual inesperada: $($result.ui_version)" }
          if ($result.stable_dashboard_replaced) { throw 'O teste detectou substituição indevida do dashboard estável' }
          if ($result.youtube_write_actions_executed) { throw 'Teste visual executou escrita no YouTube' }
          if (-not $result.screenshots -or $result.screenshots.Count -lt 5) { throw 'Conjunto de screenshots V2 incompleto' }
          foreach ($shot in $result.screenshots) {
            if ([int64]$shot.bytes -lt 20000) { throw "Screenshot visual vazio ou inválido: $($shot.path)" }
          }
          Write-Host "Elite V2 visual smoke OK. Screenshots=$($result.screenshots.Count)"

      - name: Upload screenshots and visual diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elite-v2-visual-proof
          path: artifacts/ui-v2/
          if-no-files-found: error

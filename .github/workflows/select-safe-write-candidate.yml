name: Select Safe Write Candidate

on:
  push:
    branches: ["test/mcp-real-write-validation"]
    paths:
      - ".github/workflows/select-safe-write-candidate.yml"

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      TARGET_CHANNEL_ID: UCePN99heaPy2YfUJPEMwbGA
      EXCLUDE_VIDEO_ID: l4gm7rYg8KQ

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Find a low-risk connected-channel video
        shell: bash
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          ssh -i ~/.ssh/id_ed25519 -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "cd ~/apps/youtube-creator-agent && docker compose -f deploy/docker-compose.oracle.yml exec -T -e CHANNEL_ID='$TARGET_CHANNEL_ID' -e EXCLUDE_VIDEO_ID='$EXCLUDE_VIDEO_ID' mcp python -" <<'PY'
          import json, os
          from creator_service.cloud_runtime import CloudTenantResolver, GOOGLE_SECRET_NAME
          from creator_service.verified_advanced_service import VerifiedAdvancedSafeCreatorService

          channel_id=os.environ['CHANNEL_ID'].strip()
          excluded=os.environ.get('EXCLUDE_VIDEO_ID','').strip()
          resolver=CloudTenantResolver()
          with resolver.db._connect() as conn:
              tenant_ids=[str(r[0]) for r in conn.execute(
                  "SELECT DISTINCT tenant_id FROM tenant_secrets WHERE secret_name=? ORDER BY updated_at DESC",
                  (GOOGLE_SECRET_NAME,),
              ).fetchall()]

          context=None
          youtube=None
          for tenant_id in tenant_ids:
              try:
                  candidate=resolver.resolve(tenant_id)
                  y,_=candidate.google_clients()
                  items=y.channels().list(part='id,contentDetails',mine=True).execute().get('items',[])
                  if items and str(items[0].get('id',''))==channel_id:
                      context=candidate
                      youtube=y
                      channel=items[0]
                      break
              except Exception:
                  continue
          if context is None or youtube is None:
              raise RuntimeError('tenant do canal alvo não encontrado')

          uploads=channel.get('contentDetails',{}).get('relatedPlaylists',{}).get('uploads','')
          if not uploads:
              raise RuntimeError('playlist de uploads não encontrada')
          playlist_items=youtube.playlistItems().list(
              part='contentDetails',playlistId=uploads,maxResults=50
          ).execute().get('items',[])
          ids=[str(x.get('contentDetails',{}).get('videoId','')) for x in playlist_items]
          ids=[x for x in ids if x and x != excluded]
          if not ids:
              raise RuntimeError('nenhum vídeo candidato encontrado')

          videos=youtube.videos().list(part='snippet,status,statistics',id=','.join(ids)).execute().get('items',[])
          service=VerifiedAdvancedSafeCreatorService(context)
          rows=[]
          for item in videos:
              video_id=str(item.get('id',''))
              snippet=item.get('snippet',{}) or {}
              status=item.get('status',{}) or {}
              stats=item.get('statistics',{}) or {}
              tags=list(snippet.get('tags',[]) or [])
              tag_budget=sum(len(str(tag)) + (2 if ' ' in str(tag) else 0) + 1 for tag in tags)
              memory=service.video_memory_state(video_id)
              protected=bool(memory.get('protected', False))
              rows.append({
                  'video_id':video_id,
                  'title':str(snippet.get('title','')),
                  'privacy':str(status.get('privacyStatus','')),
                  'published_at':str(snippet.get('publishedAt','')),
                  'views':int(stats.get('viewCount',0) or 0),
                  'tags_count':len(tags),
                  'tag_budget':tag_budget,
                  'recently_edited':protected,
                  'protection_seconds_remaining':int(memory.get('seconds_remaining',0) or 0),
              })

          privacy_rank={'private':0,'unlisted':1,'public':2}
          eligible=[r for r in rows if not r['recently_edited'] and r['tag_budget'] <= 430]
          if not eligible:
              raise RuntimeError('nenhum vídeo elegível sem proteção recente e com orçamento seguro de tags')
          eligible.sort(key=lambda r:(privacy_rank.get(r['privacy'],3),r['views'],r['published_at']))
          selected=eligible[0]
          print(json.dumps({'ok':True,'selected':selected,'eligible_preview':eligible[:8]},ensure_ascii=False))
          PY

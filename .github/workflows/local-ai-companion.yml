name: Local AI Companion

on:
  workflow_dispatch:
  push:
    branches:
      - feat/web-dashboard-v1
    tags:
      - 'local-ai-v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install packager
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.16.0 pytest

      - name: Run local AI unit tests
        shell: pwsh
        run: |
          python -m pytest tests/test_local_ai_capability.py tests/test_local_ai_router.py -q

      - name: Build one-click companion
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm --onefile `
            --name YCA-Local-AI-Setup `
            --paths src `
            --collect-submodules local_ai `
            scripts/yca_local_ai_setup.py

      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          .\dist\YCA-Local-AI-Setup.exe --self-test | Tee-Object -FilePath local-ai-self-test.json
          $result = Get-Content local-ai-self-test.json -Raw | ConvertFrom-Json
          if (-not $result.ok) { throw 'Packaged companion self-test failed' }

      - name: Hash release artifact
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\dist\YCA-Local-AI-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  YCA-Local-AI-Setup.exe" | Set-Content .\dist\YCA-Local-AI-Setup.exe.sha256
          Get-Content .\dist\YCA-Local-AI-Setup.exe.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: yca-local-ai-windows
          path: |
            dist/YCA-Local-AI-Setup.exe
            dist/YCA-Local-AI-Setup.exe.sha256
            local-ai-self-test.json
          if-no-files-found: error

      - name: Publish stable local AI release
        if: github.ref == 'refs/heads/feat/web-dashboard-v1' || startsWith(github.ref, 'refs/tags/local-ai-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { 'local-ai-v1.0.0' }
          gh release view "$tag" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$tag" --target "${{ github.sha }}" --title "YouTube Creator Agent Local AI v1.0.0" --notes "Adaptive Windows local-AI companion. Detects compatible NVIDIA hardware, installs the official Ollama runtime when required, downloads the appropriate Apache-2.0 Qwen model, and pairs securely with the Creator Agent dashboard."
          }
          gh release upload "$tag" .\dist\YCA-Local-AI-Setup.exe .\dist\YCA-Local-AI-Setup.exe.sha256 --clobber

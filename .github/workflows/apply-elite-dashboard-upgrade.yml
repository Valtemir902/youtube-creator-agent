name: Apply Elite Dashboard Upgrade

on:
  push:
    paths:
      - '.github/workflows/apply-elite-dashboard-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout dashboard branch
        uses: actions/checkout@v4
        with:
          ref: feat/web-dashboard-v1
          fetch-depth: 0

      - name: Apply deterministic dashboard upgrade
        run: python scripts/apply_elite_dashboard_upgrade.py

      - name: Validate Python and dashboard contracts
        run: |
          python -m compileall -q src
          python -m pip install -q pytest
          python -m pytest -q tests/test_dashboard_elite_ui.py

      - name: Validate inline JavaScript syntax
        shell: bash
        run: |
          python - <<'PY' > /tmp/dashboard-inline.js
          from pathlib import Path
          import re
          text = Path('src/creator_service/web/dashboard.html').read_text(encoding='utf-8')
          match = re.search(r'<script>(.*?)</script>', text, re.S)
          if not match:
              raise SystemExit('dashboard inline script not found')
          print(match.group(1))
          PY
          node --check /tmp/dashboard-inline.js

      - name: Commit upgrade to dashboard branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/creator_service/web/dashboard.html src/intelligence/channel_learning.py tests/test_dashboard_elite_ui.py
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
            exit 0
          fi
          git commit -m "feat: upgrade Elite dashboard mobile intelligence UX"
          git push origin HEAD:feat/web-dashboard-v1

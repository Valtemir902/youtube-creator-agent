name: Verify Media MCP Production

on:
  push:
    paths:
      - '.github/workflows/verify-media-mcp-production.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Validate production credentials
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_HOST" && test -n "$VPS_PORT" && test -n "$VPS_USER" && test -n "$VPS_SSH_PRIVATE_KEY" && test -n "$VPS_KNOWN_HOSTS"
      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Verify deployed media engine and MCP tools
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'set -eu; cd ~/apps/youtube-creator-agent; echo HEAD=$(git rev-parse HEAD); docker compose -f deploy/docker-compose.oracle.yml ps; docker compose -f deploy/docker-compose.oracle.yml exec -T onboarding python -c "from creator_service.media_transcription import WhisperCppTranscriber; t=WhisperCppTranscriber(); print(\"MEDIA_READY=\"+str(t.ready())); print(\"FFMPEG=\"+t.ffmpeg_binary())"; docker compose -f deploy/docker-compose.oracle.yml exec -T mcp python -c "from pathlib import Path; p=Path(\"/app/src/creator_service/cloud_mcp_server.py\").read_text(); assert \"def list_connected_channels\" in p; assert \"def activate_connected_channel\" in p; print(\"MCP_CHANNEL_TOOLS=ok\")"'
      - name: Verify public MCP protection and web health
        run: |
          test "$(curl -sS -o /tmp/mcp-body -w '%{http_code}' https://mcp.silvadigitaltech.com/mcp)" = "401"
          test "$(curl -sS -o /tmp/health-body -w '%{http_code}' https://creator.silvadigitaltech.com/health)" = "200"
          test "$(curl -sS -o /tmp/ready-body -w '%{http_code}' https://creator.silvadigitaltech.com/ready)" = "200"
          python - <<'PY'
          import json
          from pathlib import Path
          health=json.loads(Path('/tmp/health-body').read_text())
          ready=json.loads(Path('/tmp/ready-body').read_text())
          assert health.get('ok') is True
          assert ready.get('ready') is True
          print('PUBLIC_HEALTH=ok')
          print('MCP_UNAUTH=401')
          PY

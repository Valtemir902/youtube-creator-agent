name: OAuth Edge Diagnostic

on:
  push:
    branches: ["feat/web-dashboard-v1"]
    paths: [".github/workflows/oauth-edge-diagnostic.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

      - name: Inspect Keycloak schema and OAuth records
        shell: bash
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          ssh -i ~/.ssh/id_ed25519 -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/apps/youtube-creator-agent
          chatgpt_client="$(docker compose -f deploy/docker-compose.oracle.yml exec -T onboarding sh -lc 'printf %s "$YCA_CHATGPT_OAUTH_CLIENT_ID"')"
          introspection_client="$(docker compose -f deploy/docker-compose.oracle.yml exec -T mcp sh -lc 'printf %s "$YCA_AUTH_INTROSPECTION_CLIENT_ID"')"
          test -n "$chatgpt_client" && test -n "$introspection_client"
          psql_cmd='psql -v ON_ERROR_STOP=1 -At -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
          run_sql() { printf '%s\n' "$1" | docker compose -f deploy/docker-compose.oracle.yml exec -T keycloak-db sh -lc "$psql_cmd"; }
          echo '=== COUNTS ==='
          run_sql "SELECT 'CHATGPT_CLIENT=' || COUNT(*) FROM client c JOIN realm r ON r.id=c.realm_id WHERE r.name='yca' AND c.client_id='${chatgpt_client}';"
          run_sql "SELECT 'INTROSPECTION_CLIENT=' || COUNT(*) FROM client c JOIN realm r ON r.id=c.realm_id WHERE r.name='yca' AND c.client_id='${introspection_client}';"
          run_sql "SELECT 'YCA_READ_SCOPE=' || COUNT(*) FROM client_scope cs JOIN realm r ON r.id=cs.realm_id WHERE r.name='yca' AND cs.name='yca:read';"
          run_sql "SELECT 'YCA_WRITE_SCOPE=' || COUNT(*) FROM client_scope cs JOIN realm r ON r.id=cs.realm_id WHERE r.name='yca' AND cs.name='yca:write';"
          run_sql "SELECT 'READ_ASSIGNED=' || COUNT(*) FROM client c JOIN realm r ON r.id=c.realm_id JOIN client_scope_client x ON x.client_id=c.id JOIN client_scope cs ON cs.id=x.scope_id WHERE r.name='yca' AND c.client_id='${chatgpt_client}' AND cs.name='yca:read';"
          run_sql "SELECT 'WRITE_ASSIGNED=' || COUNT(*) FROM client c JOIN realm r ON r.id=c.realm_id JOIN client_scope_client x ON x.client_id=c.id JOIN client_scope cs ON cs.id=x.scope_id WHERE r.name='yca' AND c.client_id='${chatgpt_client}' AND cs.name='yca:write';"
          echo '=== CLIENT_SCOPE_COLUMNS ==='
          run_sql "SELECT column_name || ':' || data_type || ':nullable=' || is_nullable FROM information_schema.columns WHERE table_schema='public' AND table_name='client_scope' ORDER BY ordinal_position;"
          echo '=== CLIENT_SCOPE_CLIENT_COLUMNS ==='
          run_sql "SELECT column_name || ':' || data_type || ':nullable=' || is_nullable FROM information_schema.columns WHERE table_schema='public' AND table_name='client_scope_client' ORDER BY ordinal_position;"
          echo '=== CHATGPT CLIENT FLAGS ==='
          run_sql "SELECT 'enabled=' || c.enabled || '|bearer_only=' || c.bearer_only || '|public_client=' || c.public_client || '|standard_flow=' || c.standard_flow_enabled || '|direct_grants=' || c.direct_access_grants_enabled FROM client c JOIN realm r ON r.id=c.realm_id WHERE r.name='yca' AND c.client_id='${chatgpt_client}';"
          echo '=== INTROSPECTION CLIENT FLAGS ==='
          run_sql "SELECT 'enabled=' || c.enabled || '|bearer_only=' || c.bearer_only || '|public_client=' || c.public_client || '|service_accounts=' || c.service_accounts_enabled || '|secret_present=' || (COALESCE(c.secret,'')<>'') FROM client c JOIN realm r ON r.id=c.realm_id WHERE r.name='yca' AND c.client_id='${introspection_client}';"
          REMOTE

      - name: Compare introspection edge and internal backchannel
        shell: bash
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          ssh -i ~/.ssh/id_ed25519 -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/apps/youtube-creator-agent
          docker compose -f deploy/docker-compose.oracle.yml exec -T mcp python - <<'PY'
          import base64,json,os,urllib.parse,urllib.request,urllib.error
          cid=os.environ['YCA_AUTH_INTROSPECTION_CLIENT_ID']; sec=os.environ['YCA_AUTH_INTROSPECTION_CLIENT_SECRET']
          for label,ep in [('CONFIGURED',os.environ['YCA_AUTH_INTROSPECTION_URL']),('INTERNAL','http://keycloak:8080/realms/yca/protocol/openid-connect/token/introspect')]:
              body=urllib.parse.urlencode({'token':'deliberately-invalid-token'}).encode()
              req=urllib.request.Request(ep,data=body,method='POST',headers={'Authorization':'Basic '+base64.b64encode(f'{cid}:{sec}'.encode()).decode(),'Content-Type':'application/x-www-form-urlencoded','Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=10) as r:
                      d=json.loads(r.read()); print(label+'_HTTP='+str(r.status)+' ACTIVE='+str(bool(d.get('active'))).lower())
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')[:220].replace('\n',' ')
                  print(label+'_HTTP='+str(e.code)+' SERVER='+str(e.headers.get('server',''))+' BODY='+raw)
          PY
          REMOTE

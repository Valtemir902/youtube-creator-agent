name: OAuth Edge Diagnostic

on:
  push:
    branches: ["feat/web-dashboard-v1"]
    paths: [".github/workflows/oauth-edge-diagnostic.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

      - name: Probe Keycloak admin API and summarize OAuth state
        shell: bash
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          ssh -i ~/.ssh/id_ed25519 -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/apps/youtube-creator-agent
          docker compose -f deploy/docker-compose.oracle.yml exec -T keycloak sh -lc '
            set -eu
            admin_user="${KC_BOOTSTRAP_ADMIN_USERNAME:-}"
            admin_pass="${KC_BOOTSTRAP_ADMIN_PASSWORD:-}"
            test -n "$admin_user" && test -n "$admin_pass"
            cfg=/tmp/kcadm-yca-probe.config
            rm -f "$cfg"
            if /opt/keycloak/bin/kcadm.sh config credentials --config "$cfg" --server http://127.0.0.1:8080 --realm master --user "$admin_user" --password "$admin_pass" >/dev/null 2>&1; then
              echo KCADM_LOGIN=ok
              /opt/keycloak/bin/kcadm.sh get realms/yca/client-scopes --config "$cfg" --fields name 2>/dev/null | grep -Eo '"name"[[:space:]]*:[[:space:]]*"[^"]+"' | sed -E 's/.*"([^"]+)"$/SCOPE=\1/' | grep -E 'SCOPE=(yca:read|yca:write|email|profile|offline_access)$' || true
              chatgpt_client="${YCA_CHATGPT_OAUTH_CLIENT_ID:-}"
              test -n "$chatgpt_client"
              cid="$(/opt/keycloak/bin/kcadm.sh get clients -r yca --config "$cfg" -q clientId="$chatgpt_client" --fields id --format csv --noquotes 2>/dev/null | tail -n 1)"
              if [ -n "$cid" ]; then
                echo CHATGPT_CLIENT_FOUND=1
                /opt/keycloak/bin/kcadm.sh get clients/$cid/default-client-scopes -r yca --config "$cfg" --fields name 2>/dev/null | grep -Eo '"name"[[:space:]]*:[[:space:]]*"[^"]+"' | sed -E 's/.*"([^"]+)"$/DEFAULT_SCOPE=\1/' | grep -E '(yca:read|yca:write|email|profile|offline_access)' || true
                /opt/keycloak/bin/kcadm.sh get clients/$cid/optional-client-scopes -r yca --config "$cfg" --fields name 2>/dev/null | grep -Eo '"name"[[:space:]]*:[[:space:]]*"[^"]+"' | sed -E 's/.*"([^"]+)"$/OPTIONAL_SCOPE=\1/' | grep -E '(yca:read|yca:write|email|profile|offline_access)' || true
              else
                echo CHATGPT_CLIENT_FOUND=0
              fi
              rm -f "$cfg"
            else
              echo KCADM_LOGIN=failed
              exit 10
            fi
          '
          REMOTE

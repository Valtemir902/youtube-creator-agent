name: OAuth Edge Diagnostic

on:
  push:
    branches: ["feat/web-dashboard-v1"]
    paths: [".github/workflows/oauth-edge-diagnostic.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

      - name: Inspect Keycloak DB schema safely
        shell: bash
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          ssh -i ~/.ssh/id_ed25519 -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/apps/youtube-creator-agent
          echo '=== CLIENT_SCOPE SCHEMA ==='
          docker compose -f deploy/docker-compose.oracle.yml exec -T keycloak-db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off -c "SELECT column_name,data_type,is_nullable FROM information_schema.columns WHERE table_name='"'"'client_scope'"'"' ORDER BY ordinal_position;"'
          echo '=== CLIENT_SCOPE_CLIENT SCHEMA ==='
          docker compose -f deploy/docker-compose.oracle.yml exec -T keycloak-db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off -c "SELECT column_name,data_type,is_nullable FROM information_schema.columns WHERE table_name='"'"'client_scope_client'"'"' ORDER BY ordinal_position;"'
          echo '=== YCA SCOPES ==='
          docker compose -f deploy/docker-compose.oracle.yml exec -T keycloak-db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off -c "SELECT cs.name, cs.protocol FROM client_scope cs JOIN realm r ON r.id=cs.realm_id WHERE r.name='"'"'yca'"'"' AND cs.name IN ('"'"'yca:read'"'"','"'"'yca:write'"'"','"'"'email'"'"','"'"'profile'"'"','"'"'offline_access'"'"') ORDER BY cs.name;"'
          echo '=== SAFE COUNTS ==='
          chatgpt_client="$(docker compose -f deploy/docker-compose.oracle.yml exec -T onboarding sh -lc 'printf %s "$YCA_CHATGPT_OAUTH_CLIENT_ID"')"
          test -n "$chatgpt_client"
          export CHATGPT_CLIENT="$chatgpt_client"
          docker compose -f deploy/docker-compose.oracle.yml exec -T -e CHATGPT_CLIENT="$chatgpt_client" keycloak-db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off -c "SELECT COUNT(*) AS chatgpt_clients FROM client c JOIN realm r ON r.id=c.realm_id WHERE r.name='"'"'yca'"'"' AND c.client_id='"'"'$CHATGPT_CLIENT'"'"';"'
          docker compose -f deploy/docker-compose.oracle.yml exec -T -e CHATGPT_CLIENT="$chatgpt_client" keycloak-db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off -c "SELECT cs.name, x.default_scope FROM client c JOIN realm r ON r.id=c.realm_id JOIN client_scope_client x ON x.client_id=c.id JOIN client_scope cs ON cs.id=x.scope_id WHERE r.name='"'"'yca'"'"' AND c.client_id='"'"'$CHATGPT_CLIENT'"'"' AND cs.name IN ('"'"'yca:read'"'"','"'"'yca:write'"'"','"'"'email'"'"','"'"'profile'"'"','"'"'offline_access'"'"') ORDER BY cs.name;"'
          REMOTE

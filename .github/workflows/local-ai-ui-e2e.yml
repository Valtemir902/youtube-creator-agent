name: Local AI UI E2E

on:
  push:
    branches: [feat/desktop-local-first-v1]
    paths:
      - 'main.py'
      - 'scripts/local_ai_ui_browser_e2e.py'
      - 'src/desktop_web_shell.py'
      - 'src/desktop_local_server.py'
      - 'src/creator_service/local_ai_dashboard.py'
      - '.github/workflows/local-ai-ui-e2e.yml'
  workflow_dispatch:

jobs:
  local-ai-ui-e2e:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
      QT_QUICK_BACKEND: software
      QTWEBENGINE_DISABLE_SANDBOX: '1'
      QTWEBENGINE_CHROMIUM_FLAGS: '--disable-gpu --disable-gpu-compositing --disable-features=VizDisplayCompositor --no-sandbox'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install only Local AI UI E2E dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install `
            'PySide6==6.7.3' `
            'PySide6-Essentials==6.7.3' `
            'PySide6-Addons==6.7.3' `
            'shiboken6==6.7.3' `
            'fastapi>=0.116,<1' `
            'google-auth>=2.34,<3' `
            'google-auth-oauthlib>=1.2,<2'

      - name: Verify browser-driven recheck activates Local AI UI
        shell: pwsh
        run: |
          $output = 'local-ai-ui-e2e-output.log'
          python scripts/local_ai_ui_browser_e2e.py 2>&1 | Tee-Object -FilePath $output
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            throw "Browser-driven Local AI UI E2E falhou com exit code $exitCode"
          }
          $jsonLine = Get-Content $output | Where-Object { $_ -match '^\{"ok"\s*:' } | Select-Object -Last 1
          if (-not $jsonLine) { throw 'Local AI UI E2E terminou sem payload JSON final' }
          $result = $jsonLine | ConvertFrom-Json
          if (-not $result.ok) { throw "Local AI UI E2E não retornou ok=true: $($result.error)" }
          if ($result.ui_status -ne 'Ativa neste dispositivo') { throw "Estado inesperado: $($result.ui_status)" }
          if (-not $result.explicit_recheck) { throw 'O E2E não comprovou a reavaliação explícita' }
          if (-not $result.paired -or -not $result.capabilities_ready) { throw 'Pareamento/capabilities não ficaram prontos' }
          if ($result.local_chat -ne 'LOCAL_AI_E2E_OK') { throw "Chat local falhou: $($result.local_chat)" }
          if ($result.cloud_session_required) { throw 'E2E exigiu sessão cloud indevidamente' }
          if ($result.youtube_write_actions_executed) { throw 'O E2E executou escrita no YouTube' }
          Write-Host 'Local AI UI E2E OK: browser -> explicit recheck -> ativa -> chat local respondeu.'

      - name: Upload Local AI E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-ai-ui-e2e-diagnostics
          path: local-ai-ui-e2e-output.log
          if-no-files-found: warn

name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip \
            pytest \
            "cryptography>=45,<51" \
            "mcp>=2.0,<3" \
            "fastapi>=0.116,<1" \
            "httpx>=0.28,<1" \
            "requests>=2.32,<3" \
            "google-api-python-client>=2.140,<3" \
            "google-auth>=2.34,<3" \
            "google-auth-oauthlib>=1.2,<2"

      - name: Compile Python sources
        run: |
          python -m compileall -q src
          python -m py_compile main.py mcp_server.py cloud_mcp_server.py onboarding_server.py

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: pytest -q

  mcp-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MCP SDK
        run: python -m pip install --upgrade pip "mcp>=2.0,<3"

      - name: Discover local and ChatGPT-native cloud MCP tools
        env:
          PYTHONPATH: src
          YCA_AUTH_ISSUER_URL: https://auth.example.com
          YCA_MCP_PUBLIC_URL: https://creator.example.com/mcp
          YCA_ONBOARDING_PUBLIC_URL: https://creator.example.com
          YCA_AUTH_INTROSPECTION_URL: https://auth.example.com/oauth/introspect
          YCA_AUTH_INTROSPECTION_CLIENT_ID: ci-client
          YCA_AUTH_INTROSPECTION_CLIENT_SECRET: ci-secret
        run: |
          python - <<'PY'
          import asyncio
          from mcp import Client
          import creator_service.mcp_server as local_server
          from creator_service.cloud_mcp_server import create_server

          LOCAL_EXPECTED = {
              "creator_status",
              "get_channel_profile",
              "research_youtube_topic",
              "build_channel_strategy",
              "preview_video_metadata_update",
              "apply_video_metadata_update",
          }

          CLOUD_EXPECTED = {
              "creator_status",
              "get_creator_capabilities",
              "create_onboarding_link",
              "get_channel_profile",
              "get_strategy_evidence",
              "validate_keyword_candidates",
              "preview_video_metadata_update",
              "apply_video_metadata_update",
          }

          CLOUD_FORBIDDEN = {
              "research_youtube_topic",
              "build_channel_strategy",
          }

          async def names_for(server):
              async with Client(server, raise_exceptions=True) as client:
                  result = await client.list_tools()
                  for tool in result.tools:
                      schema = tool.input_schema
                      assert schema.get("type") == "object"
                  return result.tools, {tool.name for tool in result.tools}

          async def main():
              _, local_names = await names_for(local_server.mcp)
              assert LOCAL_EXPECTED <= local_names

              cloud_tools, cloud_names = await names_for(create_server())
              assert CLOUD_EXPECTED <= cloud_names
              assert not (CLOUD_FORBIDDEN & cloud_names), (
                  "Cloud MCP must not expose tools that invoke backend LLM strategy: "
                  f"{sorted(CLOUD_FORBIDDEN & cloud_names)}"
              )
              for tool in cloud_tools:
                  assert "tenant_id" not in tool.input_schema.get("properties", {}), (
                      f"Cloud tool {tool.name} must derive tenant from auth, not model input"
                  )
              print("ChatGPT-native MCP + onboarding contract: OK", sorted(cloud_names))

          asyncio.run(main())
          PY

name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
    branches: [main, "feat/web-dashboard-v1"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node for web syntax checks
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip \
            pytest \
            "cryptography>=45,<51" \
            "mcp>=2.0,<3" \
            "fastapi>=0.116,<1" \
            "httpx>=0.28,<1" \
            "requests>=2.32,<3" \
            "google-api-python-client>=2.140,<3" \
            "google-auth>=2.34,<3" \
            "google-auth-oauthlib>=1.2,<2" \
            "google-genai>=1.46,<2"

      - name: Compile Python sources
        run: |
          python -m compileall -q src
          python -m py_compile main.py mcp_server.py cloud_mcp_server.py onboarding_server.py

      - name: Validate web JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          targets = [
              Path("src/creator_service/web/login.html"),
              Path("src/creator_service/web/dashboard.html"),
              Path("src/creator_service/web/onboarding.html"),
              Path("src/creator_service/web/handoff.html"),
              Path("src/creator_service/web/handoff_widget.html"),
          ]
          out = Path(".ci-js")
          out.mkdir(exist_ok=True)
          for source in targets:
              html = source.read_text(encoding="utf-8")
              blocks = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.I | re.S)
              if not blocks:
                  raise SystemExit(f"No inline script found in {source}")
              for index, block in enumerate(blocks):
                  target = out / f"{source.stem}-{index}.js"
                  target.write_text(block, encoding="utf-8")
                  print(target)
          PY
          for file in .ci-js/*.js; do node --check "$file"; done

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: pytest -q

  mcp-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install MCP contract runtime dependencies
        run: |
          python -m pip install --upgrade pip \
            "mcp>=2.0,<3" \
            "cryptography>=45,<51" \
            "requests>=2.32,<3" \
            "google-api-python-client>=2.140,<3" \
            "google-auth>=2.34,<3" \
            "google-auth-oauthlib>=1.2,<2" \
            "google-genai>=1.46,<2"

      - name: Discover exact production ChatGPT-native MCP surface
        env:
          PYTHONPATH: src
          YCA_AUTH_ISSUER_URL: https://auth.example.com
          YCA_MCP_PUBLIC_URL: https://creator.example.com/mcp
          YCA_ONBOARDING_PUBLIC_URL: https://creator.example.com
          YCA_AUTH_INTROSPECTION_URL: https://auth.example.com/oauth/introspect
          YCA_AUTH_INTROSPECTION_CLIENT_ID: ci-client
          YCA_AUTH_INTROSPECTION_CLIENT_SECRET: nonsecret-ci-fixture
        run: |
          python - <<'PY'
          import asyncio
          from pathlib import Path
          from mcp import Client
          import creator_service.mcp_server as local_server
          from creator_service.cloud_mcp_server_v1_compat import HANDOFF_UI_URI, create_server

          root = Path("cloud_mcp_server.py").read_text(encoding="utf-8")
          assert "creator_service.cloud_mcp_server_v1_compat import run" in root

          LOCAL_EXPECTED = {
              "creator_status",
              "get_channel_profile",
              "research_youtube_topic",
              "build_channel_strategy",
              "preview_video_metadata_update",
              "apply_video_metadata_update",
              "apply_video_metadata_rollback",
          }

          CLOUD_EXPECTED = {
              "creator_status", "get_creator_capabilities", "list_connected_channels",
              "activate_connected_channel", "create_onboarding_link", "get_channel_profile",
              "get_strategy_evidence", "validate_keyword_candidates",
              "preview_video_metadata_update", "apply_video_metadata_update", "apply_video_metadata_rollback",
              "list_channel_videos", "get_video_details", "get_video_transcript", "list_video_categories",
              "preview_video_metadata_update_advanced", "apply_video_metadata_update_advanced",
              "apply_video_metadata_rollback_advanced", "list_video_captions",
              "preview_caption_upload", "apply_caption_upload", "apply_caption_delete_rollback",
              "list_playlists", "get_playlist_details", "preview_playlist_metadata_update",
              "apply_playlist_metadata_update", "apply_playlist_metadata_rollback",
              "preview_playlist_item_add", "apply_playlist_item_add", "apply_playlist_item_add_rollback",
              "preview_playlist_item_remove", "apply_playlist_item_remove", "apply_playlist_item_remove_rollback",
              "render_video_metadata_handoff",
              "audit_playlist_organization", "preview_playlist_create", "apply_playlist_create",
              "apply_playlist_create_rollback", "preview_playlist_delete", "apply_playlist_delete",
              "apply_playlist_delete_recovery", "preview_playlist_item_reorder", "apply_playlist_item_reorder",
              "audit_channel_profile", "preview_channel_profile_update", "apply_channel_profile_update",
              "apply_channel_profile_rollback",
          }

          CLOUD_FORBIDDEN = {"research_youtube_topic", "build_channel_strategy"}

          READ_CLOSED = {
              "creator_status", "get_creator_capabilities", "list_connected_channels",
              "get_channel_profile", "get_strategy_evidence", "list_channel_videos",
              "get_video_details", "get_video_transcript", "list_playlists", "get_playlist_details",
              "preview_video_metadata_update", "render_video_metadata_handoff",
              "audit_playlist_organization", "audit_channel_profile",
          }
          READ_OPEN = {"validate_keyword_candidates", "list_video_categories", "list_video_captions"}
          PREVIEW = {
              "activate_connected_channel", "create_onboarding_link",
              "preview_video_metadata_update_advanced", "preview_caption_upload",
              "preview_playlist_metadata_update", "preview_playlist_item_add", "preview_playlist_item_remove",
              "preview_playlist_create", "preview_playlist_delete", "preview_playlist_item_reorder",
              "preview_channel_profile_update",
          }
          DESTRUCTIVE = {
              "apply_video_metadata_update", "apply_video_metadata_rollback",
              "apply_video_metadata_update_advanced", "apply_video_metadata_rollback_advanced",
              "apply_caption_upload", "apply_caption_delete_rollback",
              "apply_playlist_metadata_update", "apply_playlist_metadata_rollback",
              "apply_playlist_item_add", "apply_playlist_item_add_rollback",
              "apply_playlist_item_remove", "apply_playlist_item_remove_rollback",
              "apply_playlist_create", "apply_playlist_create_rollback",
              "apply_playlist_delete", "apply_playlist_delete_recovery", "apply_playlist_item_reorder",
              "apply_channel_profile_update", "apply_channel_profile_rollback",
          }

          EXPECTED_HINTS = {}
          EXPECTED_HINTS.update({name: (True, False, False) for name in READ_CLOSED})
          EXPECTED_HINTS.update({name: (True, True, False) for name in READ_OPEN})
          EXPECTED_HINTS.update({name: (False, False, False) for name in PREVIEW})
          EXPECTED_HINTS.update({name: (False, True, True) for name in DESTRUCTIVE})

          EXPECTED_SCHEMAS = {
              "preview_video_metadata_update": ({"video_id", "title", "description", "tags"}, {"video_id"}),
              "list_channel_videos": ({"max_results", "page_token"}, set()),
              "preview_playlist_create": ({"title", "description", "privacy_status", "default_language", "video_ids"}, {"title"}),
              "apply_playlist_create": ({"approval_payload", "approval_token", "user_confirmed"}, {"approval_payload", "approval_token", "user_confirmed"}),
              "apply_playlist_create_rollback": ({"rollback_payload", "rollback_token", "user_confirmed"}, {"rollback_payload", "rollback_token", "user_confirmed"}),
          }

          async def names_for(server):
              async with Client(server, raise_exceptions=True) as client:
                  result = await client.list_tools()
                  resources = await client.list_resources()
                  for tool in result.tools:
                      assert tool.input_schema.get("type") == "object"
                  return result.tools, {tool.name for tool in result.tools}, resources.resources

          async def main():
              _, local_names, _ = await names_for(local_server.mcp)
              assert LOCAL_EXPECTED <= local_names

              cloud_tools, cloud_names, resources = await names_for(create_server())
              assert cloud_names == CLOUD_EXPECTED, (
                  f"Production MCP drift: missing={sorted(CLOUD_EXPECTED-cloud_names)} "
                  f"unexpected={sorted(cloud_names-CLOUD_EXPECTED)}"
              )
              assert len(cloud_names) == 47, f"Expected exactly 47 production tools, got {len(cloud_names)}"
              assert not (CLOUD_FORBIDDEN & cloud_names)
              assert any(str(resource.uri) == HANDOFF_UI_URI for resource in resources), "Handoff UI resource missing"
              assert set(EXPECTED_HINTS) == cloud_names

              by_name = {tool.name: tool for tool in cloud_tools}
              for tool in cloud_tools:
                  assert "tenant_id" not in tool.input_schema.get("properties", {}), (
                      f"Cloud tool {tool.name} must derive tenant from auth, not model input"
                  )
                  annotations = tool.annotations
                  assert annotations is not None, f"Cloud tool {tool.name} must declare annotations"
                  hints = annotations.model_dump(by_alias=True, exclude_none=True)
                  expected = EXPECTED_HINTS[tool.name]
                  actual = (hints.get("readOnlyHint"), hints.get("openWorldHint"), hints.get("destructiveHint"))
                  assert actual == expected, f"{tool.name}: annotations {actual} != {expected}"
                  if tool.name in {"render_video_metadata_handoff", "preview_video_metadata_update"}:
                      meta = tool.meta or {}
                      assert (meta.get("ui") or {}).get("resourceUri") == HANDOFF_UI_URI
                      assert meta.get("openai/outputTemplate") == HANDOFF_UI_URI

              for name, (props, required) in EXPECTED_SCHEMAS.items():
                  schema = by_name[name].input_schema
                  assert set(schema.get("properties", {})) == props, (name, schema)
                  assert set(schema.get("required", [])) == required, (name, schema)

              print(f"Full production ChatGPT-native MCP: OK count={len(cloud_names)} resources={len(resources)}")
              print("tools=", ",".join(sorted(cloud_names)))

          asyncio.run(main())
          PY

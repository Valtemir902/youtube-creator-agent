name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip pytest "cryptography>=45,<51"

      - name: Compile Python sources
        run: |
          python -m compileall -q src
          python -m py_compile main.py mcp_server.py

      - name: Run unit tests
        run: pytest -q

  mcp-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MCP SDK
        run: python -m pip install --upgrade pip "mcp>=2.0,<3"

      - name: Discover MCP tools in memory
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import asyncio
          from mcp import Client
          import creator_service.mcp_server as server

          EXPECTED = {
              "creator_status",
              "get_channel_profile",
              "research_youtube_topic",
              "build_channel_strategy",
              "preview_video_metadata_update",
              "apply_video_metadata_update",
          }

          async def main():
              async with Client(server.mcp, raise_exceptions=True) as client:
                  result = await client.list_tools()
                  names = {tool.name for tool in result.tools}
                  missing = EXPECTED - names
                  assert not missing, f"Missing MCP tools: {sorted(missing)}"
                  for tool in result.tools:
                      assert tool.input_schema.get("type") == "object"
                  print("MCP protocol tool discovery: OK", sorted(names))

          asyncio.run(main())
          PY

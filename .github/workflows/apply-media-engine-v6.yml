name: Apply Media Engine V6

on:
  push:
    paths:
      - '.github/workflows/apply-media-engine-v6.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch script
        uses: actions/checkout@v4
        with:
          ref: main
          path: patch-src
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/web-dashboard-v1
          fetch-depth: 0
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install targeted test dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest "cryptography>=45,<51" "mcp>=2.0,<3" "fastapi>=0.116,<1" "httpx>=0.28,<1" "requests>=2.32,<3" "google-api-python-client>=2.140,<3" "google-auth>=2.34,<3" "google-auth-oauthlib>=1.2,<2"
      - name: Apply media engine patch
        working-directory: app
        run: python ../patch-src/scripts/apply_media_engine_v6.py
      - name: Validate Python JavaScript and tests
        working-directory: app
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src
          python -m py_compile cloud_mcp_server.py onboarding_server.py
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('src/creator_service/web/dashboard.html').read_text(encoding='utf-8')
          for i, block in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.I|re.S)):
              Path(f'/tmp/dashboard-media-{i}.js').write_text(block, encoding='utf-8')
          PY
          for f in /tmp/dashboard-media-*.js; do node --check "$f"; done
          pytest -q
      - name: Commit feature changes
        working-directory: app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Dockerfile.server src/creator_service/media_transcription.py src/creator_service/dashboard_routes.py src/creator_service/cloud_mcp_server.py src/creator_service/web/dashboard.html tests/test_media_transcription_contract.py
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'feat: add cross-device local transcription engine'
            git push origin HEAD:feat/web-dashboard-v1
          fi

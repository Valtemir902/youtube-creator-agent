name: Check Production E2E Secrets

on:
  push:
    branches: ["test/mcp-real-write-validation"]
    paths:
      - ".github/workflows/check-e2e-prod-secrets.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    env:
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: Check presence without exposing values
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$E2E_TEST_EMAIL" ]] && echo "E2E_TEST_EMAIL=present" || echo "E2E_TEST_EMAIL=missing"
          [[ -n "$E2E_TEST_PASSWORD" ]] && echo "E2E_TEST_PASSWORD=present" || echo "E2E_TEST_PASSWORD=missing"
          [[ -n "$VPS_HOST" ]] && echo "VPS_HOST=present" || echo "VPS_HOST=missing"

name: ChatGPT Plugin Compatibility

on:
  push:
    branches: ["feat/**", main]
    paths:
      - "src/creator_service/cloud_auth.py"
      - "src/creator_service/cloud_mcp_server.py"
      - "src/creator_service/oauth_compat.py"
      - "src/creator_service/oauth_compat_app.py"
      - "tests/test_oauth_compat.py"
      - "config/chatgpt_app.json"
      - ".github/workflows/chatgpt-plugin-compat.yml"
  workflow_dispatch:

jobs:
  public-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate app package JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('config/chatgpt_app.json').read_text(encoding='utf-8'))
          assert p['mcp_url']=='https://mcp.silvadigitaltech.com/mcp'
          assert p.get('authentication')=='oauth'
          assert p.get('data_claims',{}).get('writes_require_explicit_confirmation') is True
          print('APP_PACKAGE=ok')
          PY

      - name: Check Creator OAuth compatibility metadata
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 \
            https://creator.silvadigitaltech.com/.well-known/oauth-authorization-server \
            -o /tmp/oauth.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/oauth.json'))
          assert p['issuer'].rstrip('/')=='https://creator.silvadigitaltech.com', p
          assert p['registration_endpoint']=='https://creator.silvadigitaltech.com/oauth/register', p
          assert p['authorization_endpoint']=='https://auth.silvadigitaltech.com/realms/yca/protocol/openid-connect/auth', p
          assert p['token_endpoint']=='https://auth.silvadigitaltech.com/realms/yca/protocol/openid-connect/token', p
          scopes=set(p.get('scopes_supported') or [])
          required={'openid','email','offline_access','yca:read'}
          assert required <= scopes, (required-scopes, scopes)
          assert 'S256' in set(p.get('code_challenge_methods_supported') or [])
          assert 'none' in set(p.get('token_endpoint_auth_methods_supported') or [])
          print('CREATOR_OAUTH_METADATA=ok')
          PY

      - name: Check MCP advertises Creator OAuth issuer
        run: |
          set -euo pipefail
          found=0
          for url in \
            https://mcp.silvadigitaltech.com/.well-known/oauth-protected-resource/mcp \
            https://mcp.silvadigitaltech.com/.well-known/oauth-protected-resource; do
            code="$(curl -sS --max-time 20 -o /tmp/resource.json -w '%{http_code}' "$url")"
            if [ "$code" = "200" ]; then
              python - <<'PY'
          import json
          p=json.load(open('/tmp/resource.json'))
          servers={str(x).rstrip('/') for x in (p.get('authorization_servers') or [])}
          assert 'https://creator.silvadigitaltech.com' in servers, p
          assert 'https://auth.silvadigitaltech.com/realms/yca' not in servers, p
          scopes=set(p.get('scopes_supported') or [])
          assert 'yca:read' in scopes, p
          print('MCP_OAUTH_ROUTING=ok')
          PY
              found=1
              break
            fi
          done
          test "$found" = "1"

      - name: Reproduce exact ChatGPT DCR scope request
        run: |
          set -euo pipefail
          python - <<'PY' >/tmp/dcr-payload.json
          import json
          print(json.dumps({
            'client_name':'ChatGPT exact compatibility probe',
            'redirect_uris':['https://chatgpt.com/connector_platform_oauth_redirect'],
            'grant_types':['authorization_code','refresh_token'],
            'response_types':['code'],
            'token_endpoint_auth_method':'none',
            'scope':'openid email offline_access yca:read',
          }))
          PY
          code="$(curl -sS --max-time 20 -o /tmp/dcr.json -w '%{http_code}' \
            -H 'content-type: application/json' -H 'accept: application/json' \
            --data @/tmp/dcr-payload.json \
            https://creator.silvadigitaltech.com/oauth/register)"
          echo "CHATGPT_DCR_HTTP=$code"
          test "$code" = "201" -o "$code" = "200"
          python - <<'PY'
          import json
          p=json.load(open('/tmp/dcr.json'))
          assert p.get('client_id'), p
          returned=set(str(p.get('scope') or '').split())
          assert 'openid' not in returned, returned
          assert {'email','offline_access','yca:read'} <= returned, returned
          assert p.get('token_endpoint_auth_method','none')=='none', p.get('token_endpoint_auth_method')
          print('CHATGPT_DCR_EXACT_SCOPE=ok')
          PY

      - name: Verify registered client reaches Keycloak login with OIDC scope
        run: |
          set -euo pipefail
          auth_url="$(python - <<'PY'
          import base64, hashlib, json, secrets, urllib.parse
          meta=json.load(open('/tmp/oauth.json'))
          client=json.load(open('/tmp/dcr.json'))
          verifier=secrets.token_urlsafe(48)
          challenge=base64.urlsafe_b64encode(hashlib.sha256(verifier.encode()).digest()).rstrip(b'=').decode()
          params={
            'response_type':'code',
            'client_id':client['client_id'],
            'redirect_uri':'https://chatgpt.com/connector_platform_oauth_redirect',
            'scope':'openid email offline_access yca:read',
            'code_challenge':challenge,
            'code_challenge_method':'S256',
            'resource':'https://mcp.silvadigitaltech.com/',
          }
          print(meta['authorization_endpoint']+'?'+urllib.parse.urlencode(params))
          PY
          )"
          code="$(curl -sS --max-redirs 0 --max-time 20 \
            -A 'Mozilla/5.0 ChatGPT-OAuth-Compatibility-Probe/1.0' \
            -H 'Accept: text/html,application/xhtml+xml' \
            -o /tmp/auth.body -D /tmp/auth.headers -w '%{http_code}' "$auth_url" || true)"
          echo "CHATGPT_AUTH_HTTP=$code"
          test "$code" = "200"
          grep -Eiq '(login|username|email|password|entrar)' /tmp/auth.body
          echo 'CHATGPT_AUTH_LOGIN=ok'

      - name: Cleanup dynamic probe client
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, urllib.request
          p=pathlib.Path('/tmp/dcr.json')
          if not p.exists():
              raise SystemExit(0)
          try:
              d=json.loads(p.read_text())
          except Exception:
              raise SystemExit(0)
          uri=d.get('registration_client_uri')
          token=d.get('registration_access_token')
          if not uri or not token:
              raise SystemExit(0)
          req=urllib.request.Request(uri, method='DELETE', headers={'Authorization':'Bearer '+token})
          try:
              with urllib.request.urlopen(req, timeout=15) as r:
                  print('DCR_CLEANUP_HTTP='+str(r.status))
          except Exception as exc:
              print('DCR_CLEANUP_WARNING='+type(exc).__name__)
          PY

      - name: No secrets in app package
        run: |
          set -euo pipefail
          ! grep -Eiq '(client_secret|api[_-]?key|refresh_token|access_token|AIza[0-9A-Za-z_-]{20,})' config/chatgpt_app.json
          echo 'PUBLIC_PACKAGE_SECRET_SCAN=ok'

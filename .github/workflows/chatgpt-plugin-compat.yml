name: ChatGPT Plugin Compatibility

on:
  push:
    branches: ["feat/**", main]
    paths:
      - "src/creator_service/cloud_auth.py"
      - "src/creator_service/cloud_mcp_server.py"
      - "config/chatgpt_app.json"
      - "docs/CHATGPT_APP_SUBMISSION_PACKAGE.md"
      - ".github/workflows/chatgpt-plugin-compat.yml"
  workflow_dispatch:

jobs:
  public-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate app package JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('config/chatgpt_app.json').read_text(encoding='utf-8'))
          required = ['name','short_description','long_description','mcp_url','onboarding_url','privacy_url','terms_url','support_url']
          missing = [k for k in required if not str(p.get(k,'')).strip()]
          assert not missing, f'Missing app package fields: {missing}'
          assert p['mcp_url'] == 'https://mcp.silvadigitaltech.com/mcp'
          assert p.get('authentication') == 'oauth'
          assert p.get('data_claims',{}).get('external_ai_required_in_chatgpt_native_mode') is False
          assert p.get('data_claims',{}).get('writes_require_explicit_confirmation') is True
          print('APP_PACKAGE=ok')
          PY

      - name: Check public Creator endpoints
        run: |
          set -euo pipefail
          for url in \
            https://creator.silvadigitaltech.com/health \
            https://creator.silvadigitaltech.com/ready \
            https://creator.silvadigitaltech.com/privacy \
            https://creator.silvadigitaltech.com/terms \
            https://creator.silvadigitaltech.com/support; do
            code="$(curl -fsS -o /tmp/body -w '%{http_code}' "$url")"
            test "$code" = "200"
            test -s /tmp/body
            echo "PUBLIC_OK $url"
          done

      - name: Check OIDC discovery for ChatGPT OAuth
        run: |
          set -euo pipefail
          curl -fsS https://auth.silvadigitaltech.com/realms/yca/.well-known/openid-configuration -o /tmp/oidc.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/oidc.json'))
          required=['issuer','authorization_endpoint','token_endpoint','jwks_uri','registration_endpoint']
          missing=[k for k in required if not p.get(k)]
          assert not missing, f'Missing OIDC metadata: {missing}'
          assert p['issuer'] == 'https://auth.silvadigitaltech.com/realms/yca', p['issuer']
          scopes=set(p.get('scopes_supported') or [])
          required_scopes={'openid','offline_access','yca:read'}
          missing_scopes=sorted(required_scopes-scopes)
          assert not missing_scopes, f'Missing scopes_supported required by ChatGPT: {missing_scopes}; got={sorted(scopes)}'
          methods=set(p.get('code_challenge_methods_supported') or [])
          assert 'S256' in methods, f'PKCE S256 not advertised: {sorted(methods)}'
          token_methods=set(p.get('token_endpoint_auth_methods_supported') or [])
          assert token_methods & {'client_secret_basic','client_secret_post','none'}, f'No compatible token endpoint auth method: {sorted(token_methods)}'
          grants=set(p.get('grant_types_supported') or [])
          assert 'authorization_code' in grants, f'authorization_code missing: {sorted(grants)}'
          print('OIDC_DISCOVERY=ok')
          print('SCOPES_SUPPORTED=', ' '.join(sorted(scopes)))
          print('TOKEN_AUTH_METHODS=', ' '.join(sorted(token_methods)))
          PY

      - name: Check MCP unauthenticated challenge
        run: |
          set -euo pipefail
          curl -sS -D /tmp/mcp.headers -o /tmp/mcp.body -X POST \
            -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"chatgpt-compat-ci","version":"1"}}}' \
            https://mcp.silvadigitaltech.com/mcp || true
          status="$(head -n1 /tmp/mcp.headers | tr -d '\r')"
          echo "$status"
          grep -Eq ' 401 | 403 ' /tmp/mcp.headers
          grep -i '^www-authenticate:' /tmp/mcp.headers | tee /tmp/www-authenticate
          grep -qi 'resource_metadata=' /tmp/www-authenticate
          echo 'MCP_AUTH_GUARD=ok'

      - name: Check OAuth protected-resource metadata
        run: |
          set -euo pipefail
          found=0
          for url in \
            https://mcp.silvadigitaltech.com/.well-known/oauth-protected-resource/mcp \
            https://mcp.silvadigitaltech.com/.well-known/oauth-protected-resource; do
            code="$(curl -sS -o /tmp/resource.json -w '%{http_code}' "$url")"
            if [ "$code" = "200" ]; then
              python - <<'PY'
          import json
          p=json.load(open('/tmp/resource.json'))
          resource=str(p.get('resource') or '').rstrip('/')
          assert resource == 'https://mcp.silvadigitaltech.com', p
          servers=[str(x).rstrip('/') for x in (p.get('authorization_servers') or [])]
          assert 'https://auth.silvadigitaltech.com/realms/yca' in servers, p
          scopes=set(p.get('scopes_supported') or [])
          if scopes:
              assert 'yca:read' in scopes, f'yca:read missing from protected resource metadata: {sorted(scopes)}'
          print('PROTECTED_RESOURCE_METADATA=ok', resource)
          PY
              found=1
              break
            fi
          done
          test "$found" = "1"

      - name: Mirror ChatGPT DCR and authorization start
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, secrets, urllib.parse, urllib.request, urllib.error

          discovery=json.load(urllib.request.urlopen('https://auth.silvadigitaltech.com/realms/yca/.well-known/openid-configuration', timeout=10))
          reg=discovery['registration_endpoint']
          payload={
              'client_name':'ChatGPT compatibility probe',
              'redirect_uris':['https://chatgpt.com/connector_platform_oauth_redirect'],
              'grant_types':['authorization_code','refresh_token'],
              'response_types':['code'],
          }
          request=urllib.request.Request(reg, data=json.dumps(payload).encode(), headers={'Content-Type':'application/json','Accept':'application/json'}, method='POST')
          try:
              response=urllib.request.urlopen(request, timeout=10)
              body=response.read().decode()
              status=response.status
          except urllib.error.HTTPError as exc:
              body=exc.read().decode(errors='replace')
              status=exc.code
          print('DCR_HTTP=', status)
          print('DCR_BODY=', body)
          assert status in (200,201), f'DCR failed: HTTP {status} {body}'
          client=json.loads(body)
          client_id=client['client_id']
          redirects=client.get('redirect_uris') or []
          assert 'https://chatgpt.com/connector_platform_oauth_redirect' in redirects, redirects
          method=client.get('token_endpoint_auth_method')
          print('DCR_TOKEN_AUTH_METHOD=', method)

          verifier=secrets.token_urlsafe(48)
          challenge=base64.urlsafe_b64encode(hashlib.sha256(verifier.encode()).digest()).rstrip(b'=').decode()
          params={
              'response_type':'code',
              'client_id':client_id,
              'redirect_uri':'https://chatgpt.com/connector_platform_oauth_redirect',
              'scope':'openid offline_access yca:read',
              'code_challenge':challenge,
              'code_challenge_method':'S256',
              'resource':'https://mcp.silvadigitaltech.com/',
          }
          auth_url=discovery['authorization_endpoint']+'?'+urllib.parse.urlencode(params)
          opener=urllib.request.build_opener(urllib.request.HTTPRedirectHandler())
          try:
              auth=opener.open(auth_url, timeout=10)
              auth_body=auth.read(4096).decode(errors='replace')
              auth_status=auth.status
              final_url=auth.geturl()
          except urllib.error.HTTPError as exc:
              auth_body=exc.read(4096).decode(errors='replace')
              auth_status=exc.code
              final_url=exc.geturl()
          print('AUTH_START_HTTP=', auth_status)
          print('AUTH_START_URL=', final_url)
          print('AUTH_START_BODY_PREFIX=', auth_body[:800].replace('\n',' '))
          assert auth_status == 200, f'Authorization start failed: HTTP {auth_status} {auth_body[:800]}'
          assert '/protocol/openid-connect/auth' in auth_url
          lowered=auth_body.lower()
          assert ('login' in lowered or 'username' in lowered or 'email' in lowered or 'consent' in lowered), 'Authorization endpoint did not render an interactive login/consent page.'

          cleanup_uri=client.get('registration_client_uri')
          cleanup_token=client.get('registration_access_token')
          if cleanup_uri and cleanup_token:
              req=urllib.request.Request(cleanup_uri, headers={'Authorization':f'Bearer {cleanup_token}'}, method='DELETE')
              try:
                  urllib.request.urlopen(req, timeout=10).read()
                  print('DCR_CLEANUP=ok')
              except Exception as exc:
                  print('DCR_CLEANUP=warning', type(exc).__name__, str(exc))
          print('CHATGPT_DCR_AUTH_START=ok')
          PY

      - name: No secrets in app package
        run: |
          set -euo pipefail
          ! grep -Eiq '(client_secret|api[_-]?key|refresh_token|access_token|AIza[0-9A-Za-z_-]{20,})' config/chatgpt_app.json
          echo 'PUBLIC_PACKAGE_SECRET_SCAN=ok'

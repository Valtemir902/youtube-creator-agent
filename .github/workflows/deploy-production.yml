name: Deploy Production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["feat/web-dashboard-v1"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yca-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}

    steps:
      - name: Resolve deploy commit
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            sha="${{ github.event.workflow_run.head_sha }}"
          else
            sha="$(git ls-remote https://github.com/${{ github.repository }}.git refs/heads/feat/web-dashboard-v1 | awk '{print $1}')"
          fi
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploy candidate: $sha"

      - name: Checkout deploy candidate for classification
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.ref.outputs.sha }}
          fetch-depth: 2

      - name: Decide whether production deploy is needed
        id: classify
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.ref.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: production deploy explicitly requested."
            exit 0
          fi

          parent="$(git rev-parse "$DEPLOY_SHA^")"
          mapfile -t changed < <(git diff --name-only "$parent" "$DEPLOY_SHA")
          printf 'Changed files:\n'
          printf ' - %s\n' "${changed[@]}"

          needed=false
          for path in "${changed[@]}"; do
            case "$path" in
              .github/workflows/deploy-production.yml)
                needed=true
                break
                ;;
              .github/*|tests/*|docs/*|README.md|*.md)
                ;;
              *)
                needed=true
                break
                ;;
            esac
          done

          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          if [[ "$needed" == "true" ]]; then
            echo "Runtime/deploy-affecting change detected; production deploy will run."
          else
            echo "Only CI/test/docs files changed; skipping production deploy to avoid needless service churn."
          fi

      - name: Check deployment credentials
        id: creds
        if: steps.classify.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$VPS_HOST" && -n "$VPS_USER" && -n "$VPS_SSH_PRIVATE_KEY" && -n "$VPS_KNOWN_HOSTS" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "VPS deployment secrets are not configured yet. Deployment skipped safely."
          fi

      - name: Configure SSH
        if: steps.classify.outputs.needed == 'true' && steps.creds.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Backup persistent production state
        if: steps.classify.outputs.needed == 'true' && steps.creds.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          ssh -i ~/.ssh/id_ed25519 -p "$port" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          app="$HOME/apps/youtube-creator-agent"
          compose="$app/deploy/docker-compose.oracle.yml"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          backup="$HOME/backups/youtube-creator-agent/$stamp"
          mkdir -p "$backup/config" "$backup/yca-data"
          chmod 700 "$HOME/backups" "$HOME/backups/youtube-creator-agent" "$backup" 2>/dev/null || true
          cd "$app"

          for file in config/server.env config/keycloak.env config/tunnel.env; do
            if [[ -f "$file" ]]; then
              cp -p "$file" "$backup/config/"
            fi
          done
          chmod -R go-rwx "$backup/config" || true

          echo "[backup] exporting Keycloak PostgreSQL database"
          docker compose -f "$compose" exec -T keycloak-db sh -lc \
            'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" --format=custom' \
            > "$backup/keycloak.dump"
          test -s "$backup/keycloak.dump"
          chmod 600 "$backup/keycloak.dump"

          echo "[backup] freezing application writers for a consistent yca_data snapshot"
          mcp_id="$(docker compose -f "$compose" ps -q mcp)"
          test -n "$mcp_id"
          paused=0
          cleanup() {
            if [[ "$paused" == "1" ]]; then
              docker compose -f "$compose" unpause mcp onboarding >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          docker compose -f "$compose" pause mcp onboarding >/dev/null
          paused=1
          docker cp "$mcp_id:/app/data/." "$backup/yca-data/"
          docker compose -f "$compose" unpause mcp onboarding >/dev/null
          paused=0
          trap - EXIT

          test -f "$backup/yca-data/tenants.sqlite3"
          find "$backup/yca-data" -type f -exec chmod go-rwx {} + || true
          printf '%s\n' "$stamp" > "$backup/BACKUP_ID"
          printf '%s\n' "$(git rev-parse HEAD)" > "$backup/PRE_DEPLOY_SHA"
          echo "Production backup verified: $backup"
          REMOTE

      - name: Deploy application to VPS
        if: steps.classify.outputs.needed == 'true' && steps.creds.outputs.configured == 'true'
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.ref.outputs.sha }}
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          ssh -i ~/.ssh/id_ed25519 -p "$port" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail; cd ~/apps/youtube-creator-agent; git fetch origin '$DEPLOY_SHA'; git show '$DEPLOY_SHA:deploy/remote_update.sh' > /tmp/yca-remote-update.sh; chmod 700 /tmp/yca-remote-update.sh; /tmp/yca-remote-update.sh '$DEPLOY_SHA'"

      - name: Public post-deploy checks
        if: steps.classify.outputs.needed == 'true' && steps.creds.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --max-time 20 https://creator.silvadigitaltech.com/health
          echo
          curl --fail --show-error --silent --location --max-time 20 https://creator.silvadigitaltech.com/ready
          echo
          curl --fail --show-error --silent --location --max-time 20 https://auth.silvadigitaltech.com/realms/yca/.well-known/openid-configuration >/dev/null

          code="$(curl --show-error --silent --output /dev/null --write-out '%{http_code}' https://creator.silvadigitaltech.com/login)"
          test "$code" = "200"
          echo "Login page HTTP $code"

          handoff_code="$(curl --show-error --silent --output /dev/null --write-out '%{http_code}' https://creator.silvadigitaltech.com/handoff/v1)"
          test "$handoff_code" = "200"
          echo "Handoff page HTTP $handoff_code"

          curl --fail --show-error --silent --max-time 20 https://creator.silvadigitaltech.com/api/auth/config \
            | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("oidc_ready") is True; print("auth_config=ok")'

          headers="$(curl --fail --show-error --silent --location --max-time 20 --dump-header - --output /dev/null https://creator.silvadigitaltech.com/handoff/v1 | tr -d '\r')"
          grep -qi '^cache-control: .*no-store' <<<"$headers"
          grep -qi '^referrer-policy: no-referrer' <<<"$headers"
          grep -qi '^x-robots-tag: noindex' <<<"$headers"
          echo "Handoff security headers: OK"

      - name: Verify deployed MCP runtime and tool discovery on VPS
        if: steps.classify.outputs.needed == 'true' && steps.creds.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          ssh -i ~/.ssh/id_ed25519 -p "$port" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/apps/youtube-creator-agent"
          docker compose -f deploy/docker-compose.oracle.yml exec -T mcp python - <<'PY'
          import asyncio
          from mcp import Client
          from creator_service.cloud_mcp_server_v1_compat import HANDOFF_UI_URI, create_server

          expected = {
              'creator_status', 'get_creator_capabilities', 'list_connected_channels',
              'activate_connected_channel', 'create_onboarding_link', 'get_channel_profile',
              'get_strategy_evidence', 'validate_keyword_candidates',
              'preview_video_metadata_update', 'apply_video_metadata_update', 'apply_video_metadata_rollback',
              'list_channel_videos', 'get_video_details', 'get_video_transcript', 'list_video_categories',
              'preview_video_metadata_update_advanced', 'apply_video_metadata_update_advanced',
              'apply_video_metadata_rollback_advanced', 'list_video_captions',
              'preview_caption_upload', 'apply_caption_upload', 'apply_caption_delete_rollback',
              'list_playlists', 'get_playlist_details', 'preview_playlist_metadata_update',
              'apply_playlist_metadata_update', 'apply_playlist_metadata_rollback',
              'preview_playlist_item_add', 'apply_playlist_item_add', 'apply_playlist_item_add_rollback',
              'preview_playlist_item_remove', 'apply_playlist_item_remove', 'apply_playlist_item_remove_rollback',
              'render_video_metadata_handoff',
              'audit_playlist_organization', 'preview_playlist_create', 'apply_playlist_create',
              'apply_playlist_create_rollback', 'preview_playlist_delete', 'apply_playlist_delete',
              'apply_playlist_delete_recovery', 'preview_playlist_item_reorder', 'apply_playlist_item_reorder',
              'audit_channel_profile', 'preview_channel_profile_update', 'apply_channel_profile_update',
              'apply_channel_profile_rollback',
          }

          expected_schema = {
              'preview_playlist_create': ({'title','description','privacy_status','default_language','video_ids'}, {'title'}),
              'apply_playlist_create': ({'approval_payload','approval_token','user_confirmed'}, {'approval_payload','approval_token','user_confirmed'}),
              'apply_playlist_create_rollback': ({'rollback_payload','rollback_token','user_confirmed'}, {'rollback_payload','rollback_token','user_confirmed'}),
          }

          async def main():
              async with Client(create_server(), raise_exceptions=True) as client:
                  result = await client.list_tools()
                  resources = await client.list_resources()
                  names = {tool.name for tool in result.tools}
                  assert names == expected, f'missing={sorted(expected-names)} unexpected={sorted(names-expected)}'
                  assert len(names) == 47, len(names)
                  uris = {str(resource.uri) for resource in resources.resources}
                  assert HANDOFF_UI_URI in uris, sorted(uris)
                  by_name = {tool.name: tool for tool in result.tools}
                  for name, (properties, required) in expected_schema.items():
                      schema = by_name[name].input_schema
                      assert set(schema.get('properties', {})) == properties, (name, schema)
                      assert set(schema.get('required', [])) == required, (name, schema)
                  print(f'production_full_mcp_discovery=ok count={len(names)} resources={len(uris)}')
                  print('tools=' + ','.join(sorted(names)))
          asyncio.run(main())
          PY
          REMOTE

      - name: Checkout deployed revision for browser audit
        if: steps.classify.outputs.needed == 'true' && steps.creds.outputs.configured == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.ref.outputs.sha }}

      - name: Set up Node for browser audit
        if: steps.classify.outputs.needed == 'true' && steps.creds.outputs.configured == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install browser audit runtime
        if: steps.classify.outputs.needed == 'true' && steps.creds.outputs.configured == 'true'
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.63.0
          npm audit --audit-level=high
          npx playwright install --with-deps chromium

      - name: Live browser audit after deploy
        if: steps.classify.outputs.needed == 'true' && steps.creds.outputs.configured == 'true'
        shell: bash
        env:
          CREATOR_BASE_URL: https://creator.silvadigitaltech.com
          AUTH_HOST: auth.silvadigitaltech.com
        run: node tests/live_browser_smoke.js

      - name: Upload browser screenshots and diagnostics
        if: always() && steps.classify.outputs.needed == 'true' && steps.creds.outputs.configured == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: post-deploy-browser-audit
          path: artifacts/
          if-no-files-found: warn

name: MCP Production Log Diagnostic

on:
  workflow_dispatch:
  push:
    branches: ["feat/web-dashboard-v1"]
    paths:
      - ".github/workflows/mcp-production-log-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect MCP auth and Keycloak audience mappers safely
        shell: bash
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          ssh -i ~/.ssh/id_ed25519 -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/apps/youtube-creator-agent
          compose='docker compose -f deploy/docker-compose.oracle.yml'
          echo '=== deployed revision ==='
          git rev-parse HEAD
          echo '=== protected resource metadata ==='
          curl -sS https://mcp.silvadigitaltech.com/.well-known/oauth-protected-resource
          echo
          echo '=== recent audience/introspection failures ==='
          $compose logs --since 30m --no-color keycloak 2>&1 | grep -Ei 'INTROSPECT_TOKEN_ERROR|invalid_token|audience' | tail -n 100 || true
          echo '=== recent MCP requests ==='
          $compose logs --since 30m --no-color mcp 2>&1 | tail -n 300
          echo '=== Keycloak audience mappers ==='
          $compose exec -T keycloak-db sh -lc 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
          SELECT pm.id, pm.name, pm.protocol_mapper_name, pm.client_id, pm.client_scope_id
          FROM protocol_mapper pm
          WHERE pm.protocol_mapper_name ILIKE '%audience%' OR pm.name ILIKE '%audience%'
          ORDER BY pm.name
          LIMIT 30;
          SELECT pm.name, pm.protocol_mapper_name, pm.client_id, pm.client_scope_id, pmc.name AS config_name, pmc.value
          FROM protocol_mapper pm
          LEFT JOIN protocol_mapper_config pmc ON pmc.protocol_mapper_id=pm.id
          WHERE pm.protocol_mapper_name ILIKE '%audience%' OR pm.name ILIKE '%audience%'
          ORDER BY pm.name, pmc.name
          LIMIT 100;
          SELECT c.id, c.client_id FROM client c JOIN realm r ON r.id=c.realm_id WHERE r.name='yca' AND c.client_id IN ('yca-chatgpt','82da41e4-4d89-4ccf-b134-c6a8b01f8453');
          SELECT cs.id, cs.name FROM client_scope cs JOIN realm r ON r.id=cs.realm_id WHERE r.name='yca' AND cs.name IN ('yca:read','yca:write');
          SQL
          REMOTE

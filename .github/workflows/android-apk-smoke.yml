name: Android APK Smoke

on:
  push:
    branches: [feat/web-dashboard-v1]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-open:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install mobile toolchain
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npm audit --audit-level=high
      - name: Generate Android project and build debug APK
        working-directory: mobile
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare screenshot directory
        run: mkdir -p artifacts/android
      - name: Boot emulator, install APK, launch and capture screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r mobile/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.silvadigitaltech.youtubecreatoragent -c android.intent.category.LAUNCHER 1
            sleep 12
            adb shell dumpsys window windows | grep -E 'mCurrentFocus|mFocusedApp' > artifacts/android/focus.txt || true
            adb logcat -d -t 1200 > artifacts/android/logcat.txt
            if grep -E 'FATAL EXCEPTION.*|Process: com\.silvadigitaltech\.youtubecreatoragent.*FATAL' artifacts/android/logcat.txt; then
              echo 'Android app crashed after launch' >&2
              exit 1
            fi
            adb exec-out screencap -p > artifacts/android/android-apk-open.png
            test -s artifacts/android/android-apk-open.png
            grep -q 'com.silvadigitaltech.youtubecreatoragent' artifacts/android/focus.txt
      - name: Hash APK
        shell: bash
        run: sha256sum mobile/android/app/build/outputs/apk/debug/app-debug.apk | tee artifacts/android/apk-sha256.txt
      - name: Upload APK and launch evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-apk-smoke
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            artifacts/android/
          if-no-files-found: error

name: MCP Real Write Validation

on:
  push:
    branches: ["test/mcp-real-write-validation"]
    paths:
      - ".github/workflows/mcp-real-write-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OAUTH_BASE: https://creator.silvadigitaltech.com
      MCP_URL: https://mcp.silvadigitaltech.com/mcp
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      TARGET_VIDEO_ID: l4gm7rYg8KQ
      MODE: preview

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Authenticate and validate production MCP
        shell: bash
        run: |
          set -euo pipefail
          test -n "$E2E_TEST_EMAIL"
          test -n "$E2E_TEST_PASSWORD"
          test -n "$TARGET_VIDEO_ID"
          mkdir -p artifacts/mcp-real-write

          node <<'NODE'
          const { chromium } = require('playwright');
          const crypto = require('crypto');
          const fs = require('fs');

          const oauthBase = process.env.OAUTH_BASE;
          const mcpUrl = process.env.MCP_URL;
          const email = process.env.E2E_TEST_EMAIL;
          const password = process.env.E2E_TEST_PASSWORD;
          const videoId = process.env.TARGET_VIDEO_ID;
          const mode = process.env.MODE || 'preview';
          const redirectUri = 'https://chatgpt.com/connector_platform_oauth_redirect';
          const scope = 'openid email offline_access yca:read yca:write';
          const out = { mode, video_id: videoId, stages: {}, calls: {} };

          function b64url(buf) {
            return Buffer.from(buf).toString('base64').replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');
          }
          async function jsonFetch(url, options={}) {
            const r = await fetch(url, options);
            const text = await r.text();
            let body;
            try { body = JSON.parse(text); } catch { body = text; }
            return { status:r.status, headers:Object.fromEntries(r.headers), body };
          }
          function redact(value) {
            if (Array.isArray(value)) return value.map(redact);
            if (!value || typeof value !== 'object') return value;
            const o = {};
            for (const [k,v] of Object.entries(value)) {
              if (/token|secret|password|authorization/i.test(k)) o[k] = '[REDACTED]';
              else o[k] = redact(v);
            }
            return o;
          }
          function toolJson(response) {
            const result = response?.body?.result;
            if (!result) throw new Error(`missing tool result: ${JSON.stringify(redact(response.body))}`);
            if (result.isError) {
              const text = (result.content || []).map(x => x.text || '').join('\n');
              throw new Error(`tool returned error: ${text}`);
            }
            const text = (result.content || []).find(x => x.type === 'text')?.text;
            if (text) {
              try { return JSON.parse(text); } catch { return { text }; }
            }
            return result.structuredContent || result;
          }

          (async()=>{
            const metadata = await jsonFetch(`${oauthBase}/.well-known/oauth-authorization-server`);
            if (metadata.status !== 200) throw new Error(`oauth metadata HTTP ${metadata.status}`);
            out.stages.oauth_metadata = {status:metadata.status, issuer:metadata.body.issuer};

            const dcr = await jsonFetch(metadata.body.registration_endpoint, {
              method:'POST', headers:{'content-type':'application/json','accept':'application/json'},
              body:JSON.stringify({
                client_name:'YCA production real-write validator', redirect_uris:[redirectUri],
                grant_types:['authorization_code','refresh_token'], response_types:['code'],
                token_endpoint_auth_method:'none', scope,
              })
            });
            if (![200,201].includes(dcr.status) || !dcr.body?.client_id) throw new Error(`DCR failed ${dcr.status}`);

            const verifier = b64url(crypto.randomBytes(64));
            const challenge = b64url(crypto.createHash('sha256').update(verifier).digest());
            const state = b64url(crypto.randomBytes(24));
            const auth = new URL(metadata.body.authorization_endpoint);
            for (const [k,v] of Object.entries({response_type:'code',client_id:dcr.body.client_id,redirect_uri:redirectUri,scope,state,code_challenge:challenge,code_challenge_method:'S256',resource:mcpUrl})) auth.searchParams.set(k,v);

            const browser = await chromium.launch({headless:true});
            const ctx = await browser.newContext({locale:'pt-BR'});
            const page = await ctx.newPage();
            let callbackUrl = null;
            page.on('request', req => { if (req.url().startsWith(redirectUri)) callbackUrl = req.url(); });
            await page.goto(auth.toString(), {waitUntil:'domcontentloaded',timeout:30000});
            await page.locator('input[name="username"],input[type="email"]').first().fill(email);
            await page.locator('input[type="password"]').first().fill(password);
            await page.locator('input[type="submit"],button[type="submit"]').first().click();
            for (let i=0; i<50 && !callbackUrl; i++) await page.waitForTimeout(200);
            if (!callbackUrl && page.url().startsWith(redirectUri)) callbackUrl = page.url();
            await page.screenshot({path:'artifacts/mcp-real-write/after-login.png',fullPage:true});
            await browser.close();
            if (!callbackUrl) throw new Error('OAuth callback not observed');
            const cb = new URL(callbackUrl);
            if (cb.searchParams.get('state') !== state) throw new Error('OAuth state mismatch');
            const code = cb.searchParams.get('code');
            if (!code) throw new Error(`OAuth callback missing code: ${cb.searchParams.get('error') || 'unknown'}`);

            const tok = await jsonFetch(metadata.body.token_endpoint, {
              method:'POST', headers:{'content-type':'application/x-www-form-urlencoded','accept':'application/json'},
              body:new URLSearchParams({grant_type:'authorization_code',code,redirect_uri:redirectUri,client_id:dcr.body.client_id,code_verifier:verifier})
            });
            if (tok.status !== 200 || !tok.body?.access_token) throw new Error(`token exchange failed ${tok.status}`);
            const access = tok.body.access_token;
            out.stages.oauth = {ok:true, scope:tok.body.scope};

            async function rpc(id, method, params) {
              return jsonFetch(mcpUrl, {
                method:'POST', headers:{authorization:`Bearer ${access}`,'content-type':'application/json','accept':'application/json, text/event-stream','mcp-protocol-version':'2025-06-18'},
                body:JSON.stringify({jsonrpc:'2.0',id,method,params})
              });
            }
            let id = 1;
            const init = await rpc(id++,'initialize',{protocolVersion:'2025-06-18',capabilities:{},clientInfo:{name:'YCA-real-write-validator',version:'1.0'}});
            if (init.status !== 200 || init.body?.error) throw new Error(`initialize failed: ${JSON.stringify(redact(init.body))}`);
            await jsonFetch(mcpUrl,{method:'POST',headers:{authorization:`Bearer ${access}`,'content-type':'application/json','accept':'application/json, text/event-stream','mcp-protocol-version':'2025-06-18'},body:JSON.stringify({jsonrpc:'2.0',method:'notifications/initialized',params:{}})});

            const toolsResp = await rpc(id++,'tools/list',{});
            const tools = toolsResp.body?.result?.tools || [];
            const names = tools.map(t=>t.name);
            out.stages.tools = {count:names.length,names};
            for (const required of ['get_video_details','get_video_transcript','preview_video_metadata_update','apply_video_metadata_update','apply_video_metadata_rollback']) {
              if (!names.includes(required)) throw new Error(`required tool missing: ${required}`);
            }

            const detailsResp = await rpc(id++,'tools/call',{name:'get_video_details',arguments:{video_id:videoId}});
            const before = toolJson(detailsResp);
            out.calls.before = before;

            const transcriptResp = await rpc(id++,'tools/call',{name:'get_video_transcript',arguments:{video_id:videoId,max_chars:4000}});
            const transcript = toolJson(transcriptResp);
            out.calls.transcript = {...transcript, text: transcript.text ? transcript.text.slice(0,1200) : ''};

            const baseTitle = String(before.title || '').trim();
            const testSuffix = ' | TESTE MCP';
            const title = (baseTitle.endsWith(testSuffix) ? baseTitle : baseTitle.slice(0, Math.max(1, 100-testSuffix.length)) + testSuffix).slice(0,100);
            const marker = '[TESTE MCP: validação temporária de edição pelo YouTube Creator Agent]';
            let description = String(before.description || '').trimEnd();
            if (!description.includes(marker)) description = `${description}${description ? '\n\n' : ''}${marker}`;
            description = description.slice(0,5000);
            const tags = Array.from(new Set([...(before.tags || []).map(String),'teste mcp','youtube creator agent'])).slice(0,30);

            const previewResp = await rpc(id++,'tools/call',{name:'preview_video_metadata_update',arguments:{video_id:videoId,title,description,tags}});
            const preview = toolJson(previewResp);
            out.calls.preview = {
              video_id: preview.video_id,
              current: preview.current,
              proposed: preview.proposed,
              changed: preview.changed,
              expires_in_seconds: preview.expires_in_seconds,
              requires_explicit_user_confirmation: preview.requires_explicit_user_confirmation,
              approval_payload: preview.approval_payload,
              approval_token: '[REDACTED]'
            };

            if (mode === 'apply-rollback') {
              const applyResp = await rpc(id++,'tools/call',{name:'apply_video_metadata_update',arguments:{approval_payload:preview.approval_payload,approval_token:preview.approval_token,user_confirmed:true}});
              const applied = toolJson(applyResp);
              out.calls.apply = redact(applied);

              const afterApply = toolJson(await rpc(id++,'tools/call',{name:'get_video_details',arguments:{video_id:videoId}}));
              out.calls.after_apply = afterApply;
              for (const [field, expected] of [['title',title],['description',description]]) {
                if (afterApply[field] !== expected) throw new Error(`post-apply verification failed for ${field}`);
              }
              if (JSON.stringify(afterApply.tags || []) !== JSON.stringify(tags)) throw new Error('post-apply verification failed for tags');

              const rollback = applied.rollback_preview || {};
              if (!rollback.rollback_payload || !rollback.rollback_token) throw new Error('apply did not return rollback package');
              const rollbackResp = await rpc(id++,'tools/call',{name:'apply_video_metadata_rollback',arguments:{rollback_payload:rollback.rollback_payload,rollback_token:rollback.rollback_token,user_confirmed:true}});
              out.calls.rollback = redact(toolJson(rollbackResp));

              const restored = toolJson(await rpc(id++,'tools/call',{name:'get_video_details',arguments:{video_id:videoId}}));
              out.calls.restored = restored;
              for (const field of ['title','description','category_id']) {
                if (restored[field] !== before[field]) throw new Error(`rollback verification failed for ${field}`);
              }
              if (JSON.stringify(restored.tags || []) !== JSON.stringify(before.tags || [])) throw new Error('rollback verification failed for tags');
              out.stages.real_write = {ok:true, applied:true, rollback_verified:true};
            } else {
              out.stages.real_write = {ok:true, applied:false, reason:'preview-only validation'};
            }

            fs.writeFileSync('artifacts/mcp-real-write/result.json',JSON.stringify(out,null,2));
            console.log(JSON.stringify(redact(out),null,2));
          })().catch(err=>{
            out.failure = String(err?.stack || err);
            fs.writeFileSync('artifacts/mcp-real-write/result.json',JSON.stringify(redact(out),null,2));
            console.error(out.failure);
            process.exit(1);
          });
          NODE

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-real-write-validation
          path: artifacts/mcp-real-write/
          if-no-files-found: warn

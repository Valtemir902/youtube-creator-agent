name: Apply Overview Channels V5

on:
  push:
    paths:
      - '.github/workflows/apply-overview-channels-v5.yml'
      - 'scripts/apply_overview_channels_v5.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch script
        uses: actions/checkout@v4
        with:
          ref: main
          path: patcher
          fetch-depth: 1

      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/web-dashboard-v1
          path: app
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest "cryptography>=45,<51" "google-api-python-client>=2.140,<3" "google-auth>=2.34,<3" "google-auth-oauthlib>=1.2,<2"

      - name: Apply patch and run targeted checks
        working-directory: app
        run: |
          python ../patcher/scripts/apply_overview_channels_v5.py
          python -m py_compile src/creator_service/channel_accounts.py src/creator_service/google_oauth.py src/creator_service/onboarding_service.py src/creator_service/dashboard_routes.py
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('src/creator_service/web/dashboard.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.I|re.S)
          if not blocks:
              raise SystemExit('dashboard script missing')
          Path('/tmp/dashboard-v5.js').write_text(blocks[-1], encoding='utf-8')
          PY
          node --check /tmp/dashboard-v5.js
          PYTHONPATH=src python -m pytest -q tests/test_dashboard_elite_ui.py tests/test_tenant_store.py

      - name: Commit overview and multi-channel v5
        working-directory: app
        run: |
          if git diff --quiet; then
            echo 'Already integrated'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/creator_service/channel_accounts.py src/creator_service/google_oauth.py src/creator_service/onboarding_service.py src/creator_service/dashboard_routes.py src/creator_service/web/dashboard.html tests/test_dashboard_elite_ui.py
          git commit -m 'feat: reorganize overview and add multi-channel switching'
          git push origin HEAD:feat/web-dashboard-v1

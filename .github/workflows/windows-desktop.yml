name: Windows Desktop Release Smoke

on:
  pull_request:
    branches: [feat/web-dashboard-v1]
    paths:
      - 'main.py'
      - 'src/**'
      - 'scripts/build_windows.py'
      - 'desktop_windows.spec'
      - 'requirements.txt'
      - 'requirements-build-windows.txt'
      - '.github/workflows/windows-desktop.yml'
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build and runtime-smoke packaged EXE
        shell: pwsh
        run: python scripts/build_windows.py

      - name: Verify artifact and hash
        shell: pwsh
        run: |
          $exe = 'artifacts/windows/YouTube-Creator-Agent-Elite.exe'
          $hashFile = "$exe.sha256"
          if (!(Test-Path $exe)) { throw "EXE ausente" }
          if (!(Test-Path $hashFile)) { throw "SHA256 ausente" }
          $actual = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          $expected = ((Get-Content $hashFile -Raw).Trim().Split()[0]).ToLowerInvariant()
          if ($actual -ne $expected) { throw "SHA256 divergente" }
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Smoke test do EXE falhou com $LASTEXITCODE" }

      - name: Upload verified Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: yca-windows-desktop-verified
          path: artifacts/windows/
          if-no-files-found: error

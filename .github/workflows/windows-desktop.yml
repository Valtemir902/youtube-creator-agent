name: Windows Desktop Release Smoke

on:
  push:
    branches: [feat/elite-v2-ui-system, feat/web-dashboard-v1]
    paths:
      - 'main.py'
      - 'src/**'
      - 'scripts/build_windows.py'
      - 'scripts/ui_v2_visual_smoke.py'
      - 'scripts/local_ai_ui_browser_e2e.py'
      - 'desktop_windows.spec'
      - 'requirements.txt'
      - 'requirements-build-windows.txt'
      - '.github/workflows/windows-desktop.yml'
  pull_request:
    branches: [feat/web-dashboard-v1]
    paths:
      - 'main.py'
      - 'src/**'
      - 'scripts/build_windows.py'
      - 'scripts/ui_v2_visual_smoke.py'
      - 'desktop_windows.spec'
      - 'requirements.txt'
      - 'requirements-build-windows.txt'
      - '.github/workflows/windows-desktop.yml'
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build and runtime-smoke packaged EXE
        shell: pwsh
        run: python scripts/build_windows.py

      - name: Verify artifact, hash, and GUI self-test exit code
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'artifacts/windows/YouTube-Creator-Agent-Elite.exe').Path
          $hashFile = "$exe.sha256"
          if (!(Test-Path $exe)) { throw "EXE ausente" }
          if (!(Test-Path $hashFile)) { throw "SHA256 ausente" }

          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          $expected = ((Get-Content -LiteralPath $hashFile -Raw).Trim().Split()[0]).ToLowerInvariant()
          if ($actual -ne $expected) { throw "SHA256 divergente: atual=$actual esperado=$expected" }

          $process = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) {
            throw "Smoke test do EXE falhou com exit code $($process.ExitCode)"
          }
          Write-Host "EXE GUI self-test OK. ExitCode=$($process.ExitCode) SHA256=$actual"

      - name: Verify Local AI becomes active inside packaged EXE
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_OPENGL: software
          QT_QUICK_BACKEND: software
          QTWEBENGINE_DISABLE_SANDBOX: '1'
          QTWEBENGINE_CHROMIUM_FLAGS: '--disable-gpu --disable-gpu-compositing --disable-features=VizDisplayCompositor --no-sandbox'
        run: |
          $exe = (Resolve-Path 'artifacts/windows/YouTube-Creator-Agent-Elite.exe').Path
          & $exe --local-ai-ui-self-test | Tee-Object -FilePath artifacts/windows/local-ai-ui-e2e.json
          if ($LASTEXITCODE -ne 0) { throw "Local AI UI E2E falhou com exit code $LASTEXITCODE" }
          $result = Get-Content artifacts/windows/local-ai-ui-e2e.json -Raw | ConvertFrom-Json
          if (-not $result.ok) { throw 'Local AI UI E2E não retornou ok=true' }
          if ($result.ui_status -ne 'Ativa neste dispositivo') { throw "Estado inesperado da IA Local: $($result.ui_status)" }
          if (-not $result.paired -or -not $result.capabilities_ready) { throw 'Pareamento/capabilities da IA Local não ficaram prontos' }
          if ($result.local_chat -ne 'LOCAL_AI_E2E_OK') { throw "Chat local não atravessou a interface: $($result.local_chat)" }
          if ($result.youtube_write_actions_executed) { throw 'Teste de IA Local executou escrita no YouTube' }
          Write-Host 'Local AI UI E2E OK: aguardando -> ativa -> chat local respondeu.'

      - name: Capture Elite V2 desktop and mobile screenshots
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_OPENGL: software
          QT_QUICK_BACKEND: software
          QTWEBENGINE_DISABLE_SANDBOX: '1'
          QTWEBENGINE_CHROMIUM_FLAGS: '--disable-gpu --disable-gpu-compositing --disable-features=VizDisplayCompositor --no-sandbox'
        run: |
          $visualPython = (Resolve-Path 'build/windows-release/.venv/Scripts/python.exe').Path
          & $visualPython scripts/ui_v2_visual_smoke.py | Tee-Object -FilePath artifacts/windows/ui-v2-visual-smoke.json
          if ($LASTEXITCODE -ne 0) { throw "Elite V2 visual smoke falhou com exit code $LASTEXITCODE" }
          $line = Get-Content artifacts/windows/ui-v2-visual-smoke.json | Where-Object { $_ -match '^\{"ok"' } | Select-Object -Last 1
          if (-not $line) { throw 'Elite V2 visual smoke não gerou payload final' }
          $result = $line | ConvertFrom-Json
          if (-not $result.ok -or -not $result.semantic_workspace_validation) { throw 'Elite V2 visual smoke não foi validado semanticamente' }
          if ($result.youtube_write_actions_executed) { throw 'Visual smoke executou escrita no YouTube' }

      - name: Upload verified Windows artifact and screenshots
        uses: actions/upload-artifact@v4
        with:
          name: yca-windows-desktop-verified
          path: |
            artifacts/windows/
            artifacts/ui-v2/
          if-no-files-found: error

name: Production YouTube Capability Audit

on:
  workflow_dispatch:
  push:
    branches: ["feat/web-dashboard-v1"]
    paths:
      - ".github/workflows/production-youtube-capability-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"; test -n "$VPS_USER"; test -n "$VPS_SSH_PRIVATE_KEY"; test -n "$VPS_KNOWN_HOSTS"
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519; chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts

      - name: Run isolated real YouTube write audit
        shell: bash
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          ssh -i ~/.ssh/id_ed25519 -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/apps/youtube-creator-agent
          compose='docker compose -f deploy/docker-compose.oracle.yml'
          echo '=== deployed revision ==='; git rev-parse HEAD
          $compose exec -T mcp python - <<'PY'
          import sqlite3
          from creator_service.advanced_service import AdvancedSafeCreatorService
          from creator_service.cloud_runtime import CloudTenantResolver, GOOGLE_SECRET_NAME

          resolver = CloudTenantResolver()
          with sqlite3.connect(resolver.db.path) as conn:
              row = conn.execute(
                  "SELECT ts.tenant_id FROM tenant_secrets ts JOIN tenants t ON t.tenant_id=ts.tenant_id "
                  "WHERE ts.secret_name=? AND t.enabled=1 ORDER BY ts.updated_at DESC LIMIT 1",
                  (GOOGLE_SECRET_NAME,),
              ).fetchone()
          if not row: raise RuntimeError('Nenhum tenant com YouTube conectado.')
          service = AdvancedSafeCreatorService(resolver.resolve(str(row[0])))
          youtube = service._youtube()
          channel = youtube.channels().list(part='contentDetails', mine=True).execute().get('items', [])[0]
          uploads = channel['contentDetails']['relatedPlaylists']['uploads']
          playlist = youtube.playlistItems().list(part='contentDetails', playlistId=uploads, maxResults=50).execute()
          ids = [i['contentDetails']['videoId'] for i in playlist.get('items', []) if i.get('contentDetails', {}).get('videoId')]
          items = youtube.videos().list(part='snippet,liveStreamingDetails,status', id=','.join(ids), maxResults=50).execute().get('items', [])
          by_id = {i['id']: i for i in items}

          # 1) Real caption create/list/delete on an archived live. Caption writes do not use the recent-metadata guard.
          live = next((by_id[v] for v in ids if by_id.get(v, {}).get('liveStreamingDetails')), None)
          if live is None: raise RuntimeError('Nenhuma live encontrada.')
          live_id = live['id']
          print('caption_test_live_id=', live_id)
          print('caption_test_live_title=', live.get('snippet', {}).get('title'))
          caption_id = None
          try:
              preview = service.preview_caption_upload(
                  video_id=live_id, language='pt-BR',
                  content='1\n00:00:00,000 --> 00:00:01,500\nTeste técnico reversível do YouTube Creator Agent\n',
                  name='YCA teste reversível', caption_format='srt',
              )
              result = service.apply_caption_upload(approval_payload=preview['approval_payload'], approval_token=preview['approval_token'])
              caption_id = result['caption_id']
              listed = service.list_video_captions(live_id).get('captions', [])
              if not any(c.get('id') == caption_id for c in listed): raise RuntimeError('Legenda não apareceu após upload.')
              print('real_caption_upload=ok caption_id=', caption_id)
              rb = result['rollback_preview']
              service.apply_caption_delete(rollback_payload=rb['rollback_payload'], rollback_token=rb['rollback_token'])
              caption_id = None
              print('caption_delete_rollback=ok')
          finally:
              if caption_id:
                  youtube.captions().delete(id=caption_id).execute()
                  print('caption_emergency_cleanup=ok')

          # 2) Tag-only test on a normal published video, if available, to distinguish a live-specific YouTube behavior.
          normal = None
          for v in ids:
              item = by_id.get(v, {})
              if item and not item.get('liveStreamingDetails') and item.get('status', {}).get('privacyStatus') in ('public','unlisted'):
                  if not service.memory.recent_edit_state(v).protected:
                      normal = item
                      break
          if normal is None:
              print('normal_video_tag_test=SKIPPED no_unprotected_normal_video')
          else:
              video_id = normal['id']
              before = service._current_video_snippet(video_id)
              tags = list(before.get('tags', []) or [])[:12]
              if tags: tags[0] = 'creator agent metadata test'
              else: tags = ['creator agent metadata test']
              applied = None
              try:
                  preview = service.preview_video_metadata_update(video_id=video_id, tags=tags)
                  applied = service.apply_video_metadata_update(approval_payload=preview['approval_payload'], approval_token=preview['approval_token'])
                  after = service._current_video_snippet(video_id)
                  persisted = after.get('tags') == preview['proposed'].get('tags')
                  print('normal_video_id=', video_id)
                  print('normal_video_tag_persisted=', persisted)
                  print('normal_video_tag_expected=', preview['proposed'].get('tags'))
                  print('normal_video_tag_actual=', after.get('tags'))
              finally:
                  if applied is not None:
                      snippet = {'title': before['title'], 'description': before['description'], 'tags': list(before.get('tags', []) or []), 'categoryId': before['categoryId']}
                      if before.get('defaultLanguage'): snippet['defaultLanguage'] = before['defaultLanguage']
                      youtube.videos().update(part='snippet', body={'id': video_id, 'snippet': snippet}).execute()
                      restored = service._current_video_snippet(video_id)
                      if restored != before: raise RuntimeError('Restauração do vídeo normal falhou.')
                      print('normal_video_restore=ok')

          print('ISOLATED_REAL_WRITE_AUDIT=PASS')
          PY
          REMOTE

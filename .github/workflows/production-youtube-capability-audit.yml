name: Production YouTube Capability Audit

on:
  workflow_dispatch:
  push:
    branches: ["feat/web-dashboard-v1"]
    paths:
      - ".github/workflows/production-youtube-capability-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run reversible live-video write audit
        shell: bash
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          ssh -i ~/.ssh/id_ed25519 -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/apps/youtube-creator-agent
          compose='docker compose -f deploy/docker-compose.oracle.yml'
          echo '=== deployed revision ==='
          git rev-parse HEAD
          $compose exec -T mcp python - <<'PY'
          import sqlite3
          import time
          from creator_service.advanced_service import AdvancedSafeCreatorService
          from creator_service.cloud_runtime import CloudTenantResolver, GOOGLE_SECRET_NAME

          resolver = CloudTenantResolver()
          with sqlite3.connect(resolver.db.path) as conn:
              row = conn.execute(
                  "SELECT ts.tenant_id FROM tenant_secrets ts "
                  "JOIN tenants t ON t.tenant_id=ts.tenant_id "
                  "WHERE ts.secret_name=? AND t.enabled=1 "
                  "ORDER BY ts.updated_at DESC LIMIT 1",
                  (GOOGLE_SECRET_NAME,),
              ).fetchone()
          if not row:
              raise RuntimeError('Nenhum tenant com YouTube conectado foi encontrado.')

          tenant_id = str(row[0])
          context = resolver.resolve(tenant_id)
          service = AdvancedSafeCreatorService(context)
          youtube = service._youtube()

          channel_response = youtube.channels().list(part='snippet,contentDetails', mine=True).execute()
          channel_items = channel_response.get('items', [])
          if not channel_items:
              raise RuntimeError('A conta conectada não retornou um canal do YouTube.')
          uploads = channel_items[0].get('contentDetails', {}).get('relatedPlaylists', {}).get('uploads')
          if not uploads:
              raise RuntimeError('Playlist de uploads do canal não encontrada.')

          playlist = youtube.playlistItems().list(part='contentDetails', playlistId=uploads, maxResults=50).execute()
          ids = [item.get('contentDetails', {}).get('videoId') for item in playlist.get('items', []) if item.get('contentDetails', {}).get('videoId')]
          videos = youtube.videos().list(part='snippet,liveStreamingDetails,status', id=','.join(ids), maxResults=50).execute().get('items', [])
          by_id = {item.get('id'): item for item in videos}

          chosen = None
          for video_id in ids:
              item = by_id.get(video_id) or {}
              if not item.get('liveStreamingDetails'):
                  continue
              if not service.memory.recent_edit_state(video_id).protected:
                  chosen = item
                  break
          if chosen is None:
              raise RuntimeError('Nenhuma live publicada sem proteção recente foi encontrada para o teste reversível.')

          video_id = chosen['id']
          before = service._current_video_snippet(video_id)
          print('selected_live_video_id=', video_id)
          print('selected_live_title=', before['title'])
          print('live_actual_start=', chosen.get('liveStreamingDetails', {}).get('actualStartTime'))
          print('live_actual_end=', chosen.get('liveStreamingDetails', {}).get('actualEndTime'))

          categories = service.list_video_categories('BR').get('categories', [])
          alternatives = [c['id'] for c in categories if c.get('assignable') and c.get('id') != before.get('categoryId')]
          if not alternatives:
              raise RuntimeError('Não há categoria alternativa atribuível para testar rollback de categoria.')
          test_category = alternatives[0]

          marker = '[YCA TESTE REVERSIVEL]'
          suffix = ' [YCA TEST]'
          test_title = (before['title'][:max(1, 100-len(suffix))].rstrip() + suffix)[:100]
          test_description = (before['description'].rstrip() + '\n\n' + marker).strip()
          if len(test_description) > 5000:
              test_description = marker + '\n' + before['description'][:4900]
          test_tags = list(before.get('tags', []) or [])[:12]
          if test_tags:
              test_tags[0] = 'yca-test-' + test_tags[0][:30]
          else:
              test_tags = ['yca-test']

          applied = None
          caption_id = None
          restored = False
          try:
              preview = service.preview_video_metadata_update(video_id=video_id, title=test_title, description=test_description, tags=test_tags, category_id=test_category)
              changed = preview.get('changed', {})
              required = ('title', 'description', 'tags', 'categoryId')
              if not all(changed.get(key) for key in required):
                  raise RuntimeError(f'Prévia não marcou todos os campos como alterados: {changed}')
              print('metadata_preview=ok changed=', changed)

              applied = service.apply_video_metadata_update(approval_payload=preview['approval_payload'], approval_token=preview['approval_token'])
              current = None
              for attempt in range(1, 6):
                  current = service._current_video_snippet(video_id)
                  mismatches = [key for key in required if current.get(key) != preview['proposed'].get(key)]
                  if not mismatches:
                      break
                  print('metadata_propagation_wait attempt=', attempt, 'mismatches=', mismatches)
                  time.sleep(1)
              for key in required:
                  expected = preview['proposed'].get(key)
                  actual = current.get(key)
                  print(f'metadata_verify_{key}= expected={expected!r} actual={actual!r}')
                  if actual != expected:
                      raise RuntimeError(f'YouTube não persistiu {key} como esperado: expected={expected!r} actual={actual!r}')
              print('real_metadata_edit=ok changed_fields=', applied.get('changed_fields'))

              caption_text = '1\n00:00:00,000 --> 00:00:01,500\nTeste técnico reversível do YouTube Creator Agent\n'
              caption_preview = service.preview_caption_upload(video_id=video_id, language='pt-BR', content=caption_text, name='YCA teste reversível', caption_format='srt')
              caption_result = service.apply_caption_upload(approval_payload=caption_preview['approval_payload'], approval_token=caption_preview['approval_token'])
              caption_id = caption_result['caption_id']
              listed = service.list_video_captions(video_id).get('captions', [])
              if not any(c.get('id') == caption_id for c in listed):
                  raise RuntimeError('Legenda criada não apareceu em captions.list.')
              print('real_caption_upload=ok caption_id=', caption_id)

              caption_rollback = caption_result['rollback_preview']
              service.apply_caption_delete(rollback_payload=caption_rollback['rollback_payload'], rollback_token=caption_rollback['rollback_token'])
              caption_id = None
              listed_after = service.list_video_captions(video_id).get('captions', [])
              if any(c.get('name') == 'YCA teste reversível' for c in listed_after):
                  raise RuntimeError('Legenda de teste permaneceu após rollback.')
              print('caption_rollback=ok')

              rollback = applied['rollback_preview']
              service.apply_video_metadata_rollback(rollback_payload=rollback['rollback_payload'], rollback_token=rollback['rollback_token'])
              restored = True
              after = service._current_video_snippet(video_id)
              for key in ('title', 'description', 'tags', 'categoryId', 'defaultLanguage'):
                  if before.get(key) != after.get(key):
                      raise RuntimeError(f'Rollback não restaurou {key}: before={before.get(key)!r} after={after.get(key)!r}')
              print('metadata_rollback=ok')
          finally:
              if caption_id:
                  try:
                      youtube.captions().delete(id=caption_id).execute()
                      print('emergency_caption_cleanup=ok')
                  except Exception as exc:
                      print('emergency_caption_cleanup=failed', repr(exc))
              if applied is not None and not restored:
                  snippet = {'title': before['title'], 'description': before['description'], 'tags': list(before.get('tags', []) or []), 'categoryId': before['categoryId']}
                  if before.get('defaultLanguage'):
                      snippet['defaultLanguage'] = before['defaultLanguage']
                  youtube.videos().update(part='snippet', body={'id': video_id, 'snippet': snippet}).execute()
                  print('emergency_metadata_restore=ok')

          print('REAL_LIVE_VIDEO_WRITE_AUDIT=PASS')
          PY
          REMOTE

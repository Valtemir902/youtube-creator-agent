name: Metadata Write Recovery Regression

on:
  workflow_dispatch:
  push:
    branches: ["feat/web-dashboard-v1"]
    paths:
      - "src/creator_service/responsible_service.py"
      - "src/creator_service/mcp_errors.py"
      - "tests/test_responsible_write_recovery.py"
      - "tests/test_mcp_errors_write_recovery.py"
      - ".github/workflows/metadata-write-recovery-regression.yml"

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest "cryptography>=45,<51" "google-api-python-client>=2.140,<3" "google-auth>=2.34,<3" "google-auth-oauthlib>=1.2,<2"
      - name: Run metadata recovery regression only
        env:
          PYTHONPATH: src
        run: pytest -q tests/test_responsible_write_recovery.py tests/test_mcp_errors_write_recovery.py

name: Production Stabilization Code Audit

on:
  push:
    branches: ["fix/production-stabilization-mcp-v2"]
    paths:
      - ".github/workflows/production-stabilization-code-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect relevant production code paths
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Whisper / transcription references ==='
          grep -RInE 'pywhispercpp|whisper|transcrib|audio.*download|yt-dlp|yt_dlp|ffmpeg' src Dockerfile.server requirements*.txt || true
          echo '=== AI settings save / Gemini references ==='
          grep -RInE 'save_settings\(|AISettings\(|google\.generativeai|google_genai|from google import genai|GeminiProvider' src onboarding_server.py main.py || true
          echo '=== Approval / replay persistence references ==='
          grep -RInE 'approval|rollback|replay|nonce|jti|consum' src/creator_service tests | head -n 500 || true

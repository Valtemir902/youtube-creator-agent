name: Diagnose Media Runtime

on:
  push:
    paths:
      - '.github/workflows/diagnose-media-runtime.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Validate production credentials
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_HOST" && test -n "$VPS_PORT" && test -n "$VPS_USER" && test -n "$VPS_SSH_PRIVATE_KEY" && test -n "$VPS_KNOWN_HOSTS"
      - name: Inspect media runtime safely
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'set -eu; echo "ARCH=$(uname -m)"; echo "KERNEL=$(uname -s)"; echo "CPUS=$(getconf _NPROCESSORS_ONLN)"; free -h || true; df -h / || true; command -v ffmpeg || true; ffmpeg -version 2>/dev/null | head -n 1 || true; cd ~/apps/youtube-creator-agent; docker compose -f deploy/docker-compose.oracle.yml ps; docker compose -f deploy/docker-compose.oracle.yml exec -T onboarding python -c "import platform; print(\"PY_ARCH=\"+platform.machine()); print(\"PY=\"+platform.python_version())"'

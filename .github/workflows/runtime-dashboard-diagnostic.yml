name: Runtime Dashboard Diagnostic

on:
  push:
    branches: [feat/web-dashboard-v1]
    paths: [.github/workflows/runtime-dashboard-diagnostic.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check deployment credentials
        id: creds
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          if [[ -n "$VPS_HOST" && -n "$VPS_USER" && -n "$VPS_SSH_PRIVATE_KEY" && -n "$VPS_KNOWN_HOSTS" ]]; then echo 'configured=true' >> "$GITHUB_OUTPUT"; else echo 'configured=false' >> "$GITHUB_OUTPUT"; exit 1; fi
      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
      - name: Probe connected Google credentials without writes
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          port="${VPS_PORT:-22}"
          ssh -i ~/.ssh/id_ed25519 -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/apps/youtube-creator-agent"
          docker compose -f deploy/docker-compose.oracle.yml exec -T mcp python - <<'PY'
          import json
          from creator_service.cloud_runtime import CloudTenantResolver, GOOGLE_SECRET_NAME
          from googleapiclient.errors import HttpError

          resolver = CloudTenantResolver()
          db = resolver.db
          with db._connect() as conn:
              rows = conn.execute("SELECT tenant_id FROM tenant_secrets WHERE secret_name=?", (GOOGLE_SECRET_NAME,)).fetchall()
          print(f"connected_tenants={len(rows)}")
          failures = 0
          for idx, row in enumerate(rows, 1):
              tenant_id = str(row[0])
              try:
                  raw = db.get_secret(tenant_id, GOOGLE_SECRET_NAME)
                  info = json.loads(raw or '{}')
                  print(f"tenant_{idx}_stored_scopes={sorted(info.get('scopes') or [])}")
                  yt, analytics = resolver._google_clients(tenant_id)
                  ch = yt.channels().list(part='snippet,statistics', mine=True).execute()
                  print(f"tenant_{idx}_youtube=ok items={len(ch.get('items', []))}")
                  try:
                      analytics.reports().query(ids='channel==MINE', startDate='2026-09-01', endDate='2026-09-12', metrics='views', dimensions='day', maxResults=1).execute()
                      print(f"tenant_{idx}_analytics=ok")
                  except HttpError as exc:
                      failures += 1
                      print(f"tenant_{idx}_analytics=http_{exc.resp.status} reason={getattr(exc, 'reason', '')[:180]}")
                  except Exception as exc:
                      failures += 1
                      print(f"tenant_{idx}_analytics={type(exc).__name__}:{str(exc)[:180]}")
              except HttpError as exc:
                  failures += 1
                  print(f"tenant_{idx}_youtube=http_{exc.resp.status} reason={getattr(exc, 'reason', '')[:180]}")
              except Exception as exc:
                  failures += 1
                  print(f"tenant_{idx}_youtube={type(exc).__name__}:{str(exc)[:180]}")
          print(f"diagnostic_failures={failures}")
          PY
          REMOTE
